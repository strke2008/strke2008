    <div class="lead"><h2>🎓 ماذا تعلمت من التجربة؟</h2><p>تعلمت أن ${L.lead}</p></div>
    <section><h3>🔎 ماذا لاحظت؟</h3>
      <p>توقعت أن الراكب غير المربوط «${predName}». ${x.pred==='fwd'?'وتحقق توقعك.':'والنتيجة أنه اندفع إلى الأمام. التجربة هي التي تحسم.'}</p>
      <div class="tablewrap"><table><thead><tr><th>الكتلة</th><th>الدفعة</th><th>زمن قطع 1.00 m</th><th>السرعة (حسابك)</th><th>التسارع أثناء الدفع</th></tr></thead><tbody>
      ${x.lanes.slice().sort((a,b)=>a.m-b.m).map(l=>`<tr><td class="num">${kg(l.m)} kg</td><td class="num">${x.Ff} N</td><td class="num">${inT(x.Ff,l.m).toFixed(2)} s</td><td class="num">${l.calc.length?fx2(l.calc[l.calc.length-1]):'—'} m/s</td><td class="num">${(x.Ff/l.m).toFixed(1)} m/s²</td></tr>`).join('')}
      </tbody></table></div>
      ${mine?`<p class="note" style="margin-top:8px">ملاحظاتك: ${mine}.</p>`:''}</section>
    <section><h3>🧠 ماذا حدث؟</h3><p>${bidi(L.happened)}</p></section>
    <section><h3>💡 لماذا حدث ذلك؟</h3><p>${bidi(L.why)}</p></section>
    <section><h3>🚗 وفي الحياة</h3><p>عند الفرملة المفاجئة تتوقف السيارة، وجسمك يستمر في الحركة إلى الأمام بسبب قصوره الذاتي. حزام الأمان هو القوة التي توقفك مع السيارة.</p></section>
    <div class="concept"><h3>🎯 المفهوم الذي تعلمته</h3><p>${L.concept}</p></div>
    <div class="actions"><button class="btn" id="toApply">اختبر فهمك في موقف جديد</button></div>
  </article>`;
  $('#toApply').onclick=()=>go('apply');
}

/* =========================================================
   🔗 الربط مع مساعد المعلم (بوابة الطالب + الـ Worker)
   ========================================================= */
async function portalApi(path,opts){
  const r=await fetch(PORTAL.api+path,Object.assign({cache:'no-store'},opts||{}));
  let j=null;try{j=await r.json()}catch(e){}
  return {status:r.status,j};
}
function portalScreen(html){app.innerHTML=`<div class="learn" style="padding-top:28px">${html}</div>`}
async function portalBoot(){
  $$('.nav button').forEach(b=>b.style.display='none');
  $('.nav').insertAdjacentHTML('beforeend','<a class="btn ghost" href="../" style="padding:6px 12px">العودة لبوابة الطالب</a>');
  {const br=$('.brand');const nb=br.cloneNode(true);nb.removeAttribute('data-go');br.replaceWith(nb);}
  if(!PORTAL.sid&&!PORTAL.name){
    portalScreen(`<div class="lead"><h2>ادخل من بوابة الطالب</h2><p>سجّل دخولك في بوابة الطالب أولًا، ثم افتح التجربة من «طبّق وجرّب».</p></div><div class="actions"><a class="btn" href="../">فتح بوابة الطالب</a></div>`);return;
  }
  portalScreen('<p class="note">جارٍ تحميل التجربة…</p>');
  let res;
  try{res=await portalApi(`/lab-status?hw=${encodeURIComponent(PORTAL.hw)}&sid=${encodeURIComponent(PORTAL.sid)}&name=${encodeURIComponent(PORTAL.name)}`)}catch(e){res=null}
  if(!res||!res.j||!res.j.ok){
    const err=res&&res.j&&res.j.error;
    const msg=err==='student not allowed'?'هذه التجربة ليست مخصصة لفصلك.':err==='no such activity'?'هذه التجربة لم تعد منشورة.':err==='student not recognized'?'لم نتعرّف على حسابك. سجّل دخولك من بوابة الطالب ثم أعد المحاولة.':'تعذّر تحميل التجربة. تحقّق من اتصالك ثم أعد المحاولة.';
    portalScreen(`<div class="lead"><h2>لا يمكن فتح التجربة</h2><p>${msg}</p></div><div class="actions"><button class="btn" onclick="location.reload()">إعادة المحاولة</button><a class="btn ghost" href="../">بوابة الطالب</a></div>`);return;
  }
  const s=PORTAL.status=res.j; PORTAL.cfg=s.cfg||{topic:'mixtures',pair:null};
  APP.student=s.name||PORTAL.name;
  PORTAL.graded=!s.done||s.extra>0;
  const pr=PORTAL.cfg.pair;
  const today=new Date(Date.now()+3*3600000).toISOString().slice(0,10);
  const closed=PORTAL.graded&&s.due&&s.due<today&&!(s.extra>0);
  if(closed)PORTAL.graded=false;
  const head=PORTAL.graded
    ?`<div class="lead"><h2>🔬 ${esc(s.title||'تجربة المختبر')}</h2><p>${PORTAL.cfg.topic==='friction'?'تجربة اليوم: أثر خشونة السطح في حركة الأجسام.':PORTAL.cfg.topic==='inertia'?'تجربة اليوم: القصور الذاتي، من حزام الأمان إلى أثر الكتلة.':pr?`تجربة اليوم: ${n(pr[0])} و${n(pr[1])}.`:'اختر بنفسك مادتين واكتشف ما يحدث.'} هذه محاولة مقيَّمة ${s.extra>0?'(سمح لك معلمك بمحاولة إضافية)':'واحدة'}، ودرجتك من ${s.mx}.</p></div>
      <section><h3>قبل أن تبدأ</h3><p>تُحسب درجتك من: السلامة، وتنفيذ الخطوات، ودقة ملاحظتك، وإجاباتك، والفصل العملي، والتطبيق. الخطأ لا يُنهي التجربة؛ ستحصل على تلميحات.</p></section>`
    :`<div class="lead"><h2>🔬 ${esc(s.title||'تجربة المختبر')}</h2><p>${closed?'انتهى موعد هذه التجربة.':`سلّمت هذه التجربة${s.score!=null?` ونتيجتك ${s.score} من 100`:''}.`} يمكنك التدريب بحرية${PORTAL.cfg.topic!=='mixtures'?'':' على أي مادتين'}، ولن تُحتسب درجة.</p></div>`;
  portalScreen(`${head}<div class="actions"><button class="btn amber" id="pgo">${PORTAL.graded?'ابدأ التجربة':'ابدأ التدريب الحر'}</button><a class="btn ghost" href="../">العودة لبوابة الطالب</a></div>`);
  $('#pgo').onclick=async()=>{
    if(PORTAL.graded){try{await portalApi('/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hw:PORTAL.hw,sid:PORTAL.sid,name:PORTAL.name})})}catch(e){}}
    startRun(PORTAL.cfg.topic||'mixtures');
  };
}
function labLog(r){
  if(CONTENT[r.topic].log) return CONTENT[r.topic].log(r);
  return {pair:[r.ctx.first,r.ctx.second],answers:r.answers.map(a=>({a:a&&a.log||[]})),obs:r.obs,mist:r.mist,
    mistakes:r.log.slice(0,15),sep:{done:!!(r.sep&&r.sep.done),wrong:r.sep?r.sep.wrong:0,actions:r.sep?r.sep.actions.slice(0,40):[],steps:r.sep?r.sep.steps.slice(0,12):[]}};
}
async function renderPortalResult(r,sc,L){
  const key='lab_pending_'+PORTAL.hw;
  const body={hw:PORTAL.hw,sid:PORTAL.sid,name:PORTAL.name,dev:PORTAL.dev,log:labLog(r)};
  try{localStorage.setItem(key,JSON.stringify(body))}catch(e){}
  app.innerHTML=`${cycleHTML(7)}<article class="learn"><div class="lead"><h2>اكتشافك اليوم</h2><p>${L.lead}</p></div><section><h3>جارٍ إرسال تجربتك لمعلمك…</h3></section></article>`;
  let res=null;try{res=await portalApi('/lab-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){}
  const j=res&&res.j;
  if(!j||!j.ok){
    app.innerHTML=`${cycleHTML(7)}<article class="learn"><div class="lead"><h2>لم تُرسل التجربة بعد</h2><p>${j&&j.error==='bad_lab_log'?'حدث خطأ في بيانات التجربة. أبلغ معلمك.':'تعذّر الاتصال بالخادم. تجربتك محفوظة على هذا الجهاز؛ اضغط «أعد الإرسال» عند توفر الاتصال.'}</p></div>
      <div class="actions"><button class="btn amber" id="resend">أعد الإرسال</button></div></article>`;
    $('#resend').onclick=()=>renderPortalResult(r,sc,L);return;
  }
  try{localStorage.removeItem(key)}catch(e){}
  PORTAL.graded=false;
  if(j.already){
    app.innerHTML=`${cycleHTML(7)}<article class="learn"><div class="lead"><h2>سبق أن سلّمت هذه التجربة</h2><p>المحاولة المقيَّمة واحدة${j.score!=null?`، ونتيجتك المسجّلة ${j.score} من 100`:''}. ما فعلته الآن تدريب لا يغيّر درجتك.</p></div>
      <div class="actions"><button class="btn" id="again">تدريب حر</button><a class="btn ghost" href="../">العودة لبوابة الطالب</a></div></article>`;
    $('#again').onclick=()=>startRun(r.topic);return;
  }
  const lab=j.lab||{};
  app.innerHTML=`${cycleHTML(7)}<article class="learn">
    <div class="lead"><h2>اكتشافك اليوم</h2><p>${L.lead}</p></div>
    <section><h3>وصلت تجربتك لمعلمك ✓</h3>
      <div class="score"><b class="num">${j.grade}</b><span>من ${j.mx} (${j.score} من 100)، ${gradeWord(j.score)}</span></div>
      <p class="note">${j.gain>0?`أُضيفت ${j.gain} نقطة لرصيد المتجر${j.mult>1?' (مضاعفة)':''}. رصيدك الآن ${j.pts}.`:'لم تتغير نقاطك.'}</p>
      <div class="bars">${(lab.parts||[]).map(p=>`<div class="bar"><span>${esc(p[0])}</span><span class="tr"><i style="width:${Math.round(p[1]/p[2]*100)}%"></i></span><span class="num">${p[1]}/${p[2]}</span></div>`).join('')}</div>
    </section>
    <section><h3>مفاهيم أتقنتها</h3><div class="tags">${(lab.mastered||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="note">ستظهر هنا عندما تجيب من أول محاولة.</span>'}</div>
      ${(lab.reinforce||[]).length?`<h3 style="margin-top:12px">تحتاج إلى تعزيز</h3><div class="tags">${lab.reinforce.map(x=>`<span class="tag rf">${esc(x)}</span>`).join('')}</div>`:''}
    </section>
    <section><h3>تابع الاكتشاف</h3><p>${suggestNext(r)} يمكنك الآن التدريب الحر بلا درجة.</p></section>
    <div class="actions"><button class="btn" id="again">تدريب حر</button><a class="btn ghost" href="../">العودة لبوابة الطالب</a></div>
  </article>`;
  $('#again').onclick=()=>startRun(r.topic);
}

/* تحويل كل نص يظهر للطالب: نصوص اللوحات (canvas) وعُقد الصفحة */
(function(){
  const P=CanvasRenderingContext2D.prototype,orig=P.fillText;
  P.fillText=function(t,x,y,mw){const s=arNum(t);
    if(s!==String(t)){const d=this.direction;this.direction='rtl';const r=mw===undefined?orig.call(this,s,x,y):orig.call(this,s,x,y,mw);this.direction=d;return r}
    return mw===undefined?orig.call(this,s,x,y):orig.call(this,s,x,y,mw)};
  const SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1};
  /* كل جدول يأخذ عناوين أعمدته في data-label لتظهر داخل البطاقة على الجوال */
  const cardify=el=>{const ts=el.tagName==='TABLE'?[el]:el.querySelectorAll?[...el.querySelectorAll('table')]:[];
    ts.forEach(t=>{const hs=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());if(!hs.length)return;t.classList.add('cards');
      t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(hs[i]!==undefined&&td.dataset.label!==hs[i])td.dataset.label=hs[i]}))})};
  const conv=n=>{
    if(n.nodeType===3){const p=n.parentNode;if(!p||SKIP[p.nodeName])return;const v=n.nodeValue;if(/\d/.test(v)){const a=arNum(v);if(a!==v)n.nodeValue=a}}
    else if(n.nodeType===1){if(SKIP[n.nodeName])return;if(n.nodeName==='INPUT'){if(n.placeholder&&/\d/.test(n.placeholder))n.placeholder=arNum(n.placeholder);return}
      for(const ch of n.childNodes)conv(ch)}
  };
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')conv(m.target);else m.addedNodes.forEach(n=>{conv(n);if(n.nodeType===1)cardify(n)})}})
    .observe(document.body,{subtree:true,childList:true,characterData:true});
  conv(document.body);cardify(document.body);
})();

if(PORTAL.hw) portalBoot(); else go('home');

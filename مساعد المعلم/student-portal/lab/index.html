<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر العلوم الافتراضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bench:#E6ECEF; --paper:#F9FBFC; --ink:#13324A; --ink-2:#4F6879; --line:#C8D4DC;
  --glass:#4FB3C8; --amber:#D98E1F; --amber-soft:#FBEFD9; --ok:#1E8A5C; --ok-soft:#DDF2E7;
  --bad:#C3473E; --bad-soft:#F8E1DE; --tile:rgba(19,50,74,.05);
  --display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bench:#0D1D29; --paper:#14293A; --ink:#E3EDF3; --ink-2:#9AB1C1; --line:#284459;
    --glass:#6CCDE0; --amber:#F0AA45; --amber-soft:#3A2D17; --ok:#4CC28E; --ok-soft:#163528;
    --bad:#EE6B61; --bad-soft:#3D1D1B; --tile:rgba(227,237,243,.04);
  }
}
:root[data-theme="dark"]{
  --bench:#0D1D29; --paper:#14293A; --ink:#E3EDF3; --ink-2:#9AB1C1; --line:#284459;
  --glass:#6CCDE0; --amber:#F0AA45; --amber-soft:#3A2D17; --ok:#4CC28E; --ok-soft:#163528;
  --bad:#EE6B61; --bad-soft:#3D1D1B; --tile:rgba(227,237,243,.04);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bench);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;
  background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);
  background-size:28px 28px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.3;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.25rem;font-weight:700;background:none;border:0;cursor:pointer;padding:0}
.brand svg{width:30px;height:30px}
.nav{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:none;border:1px solid transparent;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink-2)}
.nav button:hover,.nav button[aria-current="page"]{border-color:var(--line);color:var(--ink);background:var(--bench)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 20px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.amber{background:var(--amber);color:#1b1206}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* home */
.hero{padding:34px 0 10px}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:700;letter-spacing:0}
.hero p{color:var(--ink-2);font-size:1.15rem;margin:6px 0 0;max-width:46ch}
.rack{margin:26px 0 8px;display:flex;align-items:flex-end;gap:clamp(10px,3vw,26px);padding:0 10px 10px;border-bottom:8px solid var(--ink);flex-wrap:wrap}
.rack .slot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.82rem;color:var(--ink-2)}
.rack .jar{transform:scale(1.25);transform-origin:bottom center;margin-bottom:8px}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 4px}
.namebox label{font-weight:600}
.namebox input{font:inherit;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-width:min(260px,100%)}
.explored{color:var(--ink-2);font-size:.95rem}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}
@media (max-width:760px){.paths{grid-template-columns:1fr}}
.path{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.path h2{font-size:1.35rem;display:flex;gap:8px;align-items:center;margin-bottom:10px}
.topic{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.topic:first-of-type{border-top:0}
.topic .t{flex:1}
.topic .t b{display:block;font-size:1.05rem}
.topic .t span{color:var(--ink-2);font-size:.92rem}
.topic.soon{opacity:.55}
.badge{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-2);white-space:nowrap}

/* cycle */
.cycle{list-style:none;margin:4px 0 14px;padding:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.cycle li{flex:1 0 auto;display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-2);padding:6px 10px;border-radius:999px;background:transparent;white-space:nowrap}
.cycle li i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;border:1.5px solid var(--line)}
.cycle li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.cycle li.now{background:var(--ink);color:var(--paper)}
.cycle li.now i{border-color:var(--paper)}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 350px;grid-template-rows:auto 1fr;gap:16px;align-items:start}
.lab>.side{grid-column:2;grid-row:1 / span 2}
#obsPanel:empty{display:none}
#obsPanel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px}

.bench,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px}
.bench{padding:14px}
.panel{padding:14px;margin-bottom:12px}
.panel h3{font-size:1.05rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 small{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--ink-2)}
.guide{display:flex;gap:12px;align-items:flex-start;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;min-height:72px}
.guide svg{flex:0 0 34px;width:34px;height:34px;margin-top:2px}
.guide .gt{flex:1}
.guide .gt p{margin:0;font-size:1.18rem;font-weight:500}
.guide .gt .who{font-size:.8rem;opacity:.7}
.guide .gact{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.guide .btn.amber{padding:8px 16px}
.gnote{margin:8px 2px 0;padding:8px 12px;border-radius:10px;background:var(--amber-soft);border-inline-start:4px solid var(--amber);font-weight:500;display:none}
.gnote.show{display:block;animation:pop .25s ease}
.gnote.bad{background:var(--bad-soft);border-color:var(--bad)}
@keyframes pop{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px;align-items:end;margin-top:12px}
.beakerzone{position:relative;display:flex;flex-direction:column;align-items:center;border-radius:16px;border:2px dashed transparent;padding:6px 0 0;transition:border-color .15s,background .15s}
.beakerzone.hot{border-color:var(--glass);background:rgba(79,179,200,.08)}
.beakerzone canvas{width:100%;max-width:290px;aspect-ratio:260/330;display:block}
.beakerzone canvas.sepcv{max-width:340px;aspect-ratio:320/360}
.benchline{width:100%;height:10px;background:var(--ink);border-radius:3px;margin-top:-4px;opacity:.85}
.droplabel{position:absolute;top:8px;inset-inline:0;text-align:center;font-size:.85rem;color:var(--ink-2);pointer-events:none}
.readings{display:grid;gap:8px}
.reading{background:var(--bench);border-radius:10px;padding:8px 10px}
.reading span{display:block;font-size:.8rem;color:var(--ink-2)}
.reading b{font-size:1.35rem;font-weight:600}
.dens{font-size:.85rem;color:var(--ink-2);background:transparent;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.dens div{display:flex;justify-content:space-between;gap:6px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:center;line-height:1.3}
.item:hover{border-color:var(--ink-2)}
.item .nm{font-weight:600;font-size:.92rem}
.item .sub{font-size:.75rem;color:var(--ink-2)}
.item.sel{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.item.dim{opacity:.4}
.item.worn{border-color:var(--ok);background:var(--ok-soft)}
.item svg{width:42px;height:42px}
.dragghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-60%) rotate(-6deg);opacity:.92;box-shadow:0 10px 24px rgba(0,0,0,.25);width:90px}
.safety ul{margin:0;padding-inline-start:18px;color:var(--ink-2);font-size:.92rem}
.jar{--c:#9cc;--c2:#7aa;width:34px;height:42px;position:relative;margin-top:6px;border:2px solid var(--ink-2);border-top:0;border-radius:3px 3px 9px 9px}
.jar::before{content:"";position:absolute;top:-7px;left:-4px;right:-4px;height:7px;background:var(--ink-2);border-radius:3px}
.jar i{position:absolute;left:2px;right:2px;bottom:2px;height:64%;border-radius:2px 2px 6px 6px;background:var(--c)}
.jar.gr i{background:radial-gradient(circle,var(--c2) 0 1.1px,transparent 1.5px) 0 0/5px 5px,var(--c)}
.jar.big i{background:radial-gradient(circle,var(--c2) 0 3px,transparent 3.5px) 0 0/10px 9px,var(--c)}
.obs{}
.obs h3{font-size:1.1rem;margin-bottom:4px}
.obs p{margin:0 0 10px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* questions */
.qwrap{max-width:760px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;gap:10px}
.qhead h2{font-size:1.4rem}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}
.qprompt{font-size:1.25rem;font-weight:600;margin:0 0 6px}
.tries{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--ink-2);margin-bottom:14px}
.tries i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.tries i.used{background:var(--amber)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;font-size:1.02rem}
.opt:hover:not(:disabled){border-color:var(--ink-2)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through;opacity:.75}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.opt:disabled{cursor:default}
.opts.toolgrid{grid-template-columns:repeat(2,1fr)}
.opts.toolgrid .opt{flex-direction:column;text-align:center;gap:4px}
.opts.toolgrid svg{width:46px;height:46px}
.fb{margin-top:14px}
.hint,.explain{padding:12px 14px;border-radius:12px;margin-top:10px}
.hint{background:var(--amber-soft);border-inline-start:4px solid var(--amber)}
.explain{background:var(--ok-soft);border-inline-start:4px solid var(--ok)}
.hint b,.explain b{display:block;margin-bottom:2px}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.seq{display:grid;gap:6px;margin-bottom:12px;counter-reset:s}
.seq .slot{min-height:46px;border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.seq .slot::before{counter-increment:s;content:counter(s);font-weight:700;color:var(--ink-2);width:22px;flex:0 0 22px;text-align:center}
.seq .slot.filled{border-style:solid;cursor:pointer;background:var(--bench)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bin{min-height:120px;border:2px dashed var(--line);border-radius:14px;padding:10px;cursor:pointer}
.bin.hot{border-color:var(--glass);background:rgba(79,179,200,.08)}
.bin h4{margin:0 0 8px;font-family:var(--display);font-size:1rem}
.bin .chip{display:inline-block;margin:0 0 6px 6px}
.card-chip{touch-action:none;user-select:none}
.card-chip.active{outline:3px solid var(--amber);outline-offset:1px}

/* learned / result */
.learn{max-width:760px;margin:0 auto}
.learn .lead{background:var(--ink);color:var(--paper);border-radius:18px;padding:22px}
.learn .lead h2{font-size:1.5rem;margin-bottom:6px}
.learn .lead p{margin:0;font-size:1.15rem}
.learn section{padding:16px 4px;border-bottom:1px dashed var(--line)}
.learn section h3{font-size:1.15rem;margin-bottom:4px}
.learn section p{margin:0}
.concept{margin-top:16px;padding:16px;border-radius:14px;border:2px solid var(--ok);background:var(--ok-soft)}
.score{display:flex;align-items:baseline;gap:10px;margin:8px 0 4px}
.score b{font-family:var(--display);font-size:3rem;line-height:1}
.bars{display:grid;gap:8px;margin-top:12px}
.bar{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:.92rem}
@media (max-width:520px){.bar{grid-template-columns:110px 1fr 50px}}
.bar .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--glass)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{border-radius:999px;padding:3px 12px;font-size:.88rem;background:var(--ok-soft);border:1px solid var(--ok)}
.tag.rf{background:var(--amber-soft);border-color:var(--amber)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* records */
.rec{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.rec summary{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;list-style:none;flex-wrap:wrap}
.rec summary::-webkit-details-marker{display:none}
.rec summary .ttl{flex:1;font-weight:600;min-width:180px}
.rec summary .meta{color:var(--ink-2);font-size:.88rem}
.rec .body{padding:0 16px 14px;font-size:.95rem}
.rec .body dl{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:0}
@media (max-width:520px){.rec .body dl{grid-template-columns:1fr}}
.rec .body dt{color:var(--ink-2)}
.rec .body dd{margin:0}
.pill{font-weight:700;border-radius:8px;padding:2px 10px;background:var(--bench)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem;background:var(--paper);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-family:var(--display);font-weight:600;background:var(--bench)}
.note{color:var(--ink-2);font-size:.92rem}
.empty{padding:30px;text-align:center;color:var(--ink-2);background:var(--paper);border:1px dashed var(--line);border-radius:14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(5px)}50%{transform:translateX(-5px)}75%{transform:translateX(3px)}}
@media (max-width:900px){
  .lab{grid-template-columns:1fr;grid-template-rows:none;gap:12px}
  .lab>.side{grid-column:auto;grid-row:auto}
  .lab.observing .bench{position:static;box-shadow:none}
  .lab .bench.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:5;box-shadow:0 8px 18px rgba(0,0,0,.12);padding:10px}
  .guide{padding:8px 12px;min-height:0}
  .guide svg{display:none}
  .guide .gt p{font-size:1.02rem}
  .stage{grid-template-columns:minmax(0,1fr) 118px;gap:8px;margin-top:8px}
  .beakerzone canvas{max-width:210px}
  .reading{padding:5px 8px}.reading b{font-size:1.05rem}
  .dens{padding:6px 8px;font-size:.78rem}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
  .item{padding:8px 2px 6px}.item svg{width:32px;height:32px}
  .top .wrap{flex-wrap:nowrap;padding-block:8px}
  .brand{font-size:1.05rem}.brand svg{width:24px;height:24px}
  .nav{flex-wrap:nowrap;gap:2px}.nav button{padding:4px 6px;font-size:.82rem;white-space:nowrap}
  .brand{white-space:nowrap}
}
/* الاحتكاك */
.frbar{display:flex;gap:12px;align-items:center;margin:12px 0 6px;flex-wrap:wrap}
.frblock{flex:0 0 auto;width:96px}
.frblock .blk{display:block;width:44px;height:26px;margin-top:6px;background:#B07A43;border:1.5px solid #5E3A17;border-radius:3px;box-shadow:inset 0 -5px 0 rgba(94,58,23,.25)}
.frforces{display:flex;gap:6px;align-items:center;font-weight:600;font-size:.92rem}
.frzone{padding:0;border-radius:12px;display:block;min-width:0}
.frzone canvas{width:100%;max-width:none!important;display:block}
.frtab td,.frtab th{white-space:nowrap}
.frin{width:84px;font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);direction:ltr;text-align:center}
.sm-btn{padding:6px 12px}
.frobs:empty{display:none}
.inh{font-size:1.08rem;margin:14px 2px 2px}
.hide-b{display:none}
.seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:600}
.seg .chip{padding:5px 12px}
.frscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;width:100%;max-width:100%}
@media (max-width:760px){
  .frzone canvas{width:760px!important}
  .frbar p{flex:1 1 100%!important;order:3}
  .frbar .btn{margin-inline-start:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== الجوال ===== */
.ls{display:none}
.swipe-hint{display:none;margin:6px 2px 0;font-size:.8rem;color:var(--ink-2);text-align:center}
@media (max-width:760px){.swipe-hint{display:block}}
@media (max-width:640px){
  .wrap{padding:12px}
  .top .wrap{gap:8px}
  .brand{font-size:1rem}.brand svg{width:22px;height:22px}
  .lf{display:none}.ls{display:inline}
  .nav button{padding:4px 7px;font-size:.84rem}
  /* مراحل التعلم: الحالية بالاسم، والبقية دوائر */
  .cycle{justify-content:space-between;gap:2px;overflow:visible}
  .cycle li{flex:0 0 auto;padding:4px;gap:4px}
  .cycle li:not(.now) .cl{display:none}
  .cycle li.now{padding:4px 10px}
  /* الجداول تتحول إلى بطاقات حتى لا يختفي عمود خارج الشاشة */
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards{background:transparent}
  table.cards tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:4px 12px;background:var(--paper)}
  table.cards td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px dashed var(--line);padding:8px 0;white-space:normal;text-align:start}
  table.cards td:last-child{border-bottom:0}
  table.cards td{flex-wrap:wrap}
  table.cards td>span{flex-wrap:wrap;margin-inline-start:auto}
  table.cards .frtab td, .frtab td{white-space:normal}
  table.cards td::before{content:attr(data-label);font-weight:600;color:var(--ink-2);font-size:.85rem;flex:0 0 auto}
  table.cards td:first-child{font-size:1.02rem}
  .tablewrap{overflow-x:visible}
  .guide .gact .btn{padding:7px 12px}
  .bar{grid-template-columns:96px 1fr 52px;gap:8px;font-size:.86rem}
  .learn .lead{padding:16px}
  .qcard{padding:14px}
  .opts.toolgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" data-go="home" aria-label="الصفحة الرئيسية">

<main id="app" class="wrap"></main>

<script>
'use strict';
/* =========================================================
   أدوات عامة
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* الأرقام والوحدات بالعربية حسب منهج المرحلة المتوسطة: م، ث، كجم، جم، مل، نيوتن، م/ث، م/ث²، °س */
const AR_D='٠١٢٣٤٥٦٧٨٩';
const UNIT_AR={'m/s²':'م/ث²','m/s':'م/ث','g/mL':'جم/مل','mL':'مل','kg':'كجم','°C':'°س','cm':'سم','N':'نيوتن','g':'جم','m':'م','s':'ث'};
function arNum(s){
  s=String(s).replace(/(\d+(?:\.\d+)?)\s?(m\/s²|m\/s|g\/mL|mL|kg|°C|cm|N|g|m|s)(?![A-Za-z\/²])/g,(x,n,u)=>n+' '+UNIT_AR[u]);
  return s.replace(/(\d)\.(?=\d)/g,'$1٫').replace(/\d/g,d=>AR_D[d]);
}
const bidi=s=>arNum(s);
/* قراءة رقم كتبه الطالب بأرقام عربية أو لاتينية */
function parseNum(v){return parseFloat(String(v).trim().replace(/[٠-٩]/g,d=>AR_D.indexOf(d)).replace(/[٫,،]/g,'.'))}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* =========================================================
   المواد والأدوات (بيانات حقيقية عند 25°C)
   ========================================================= */
const M={
  water :{name:'الماء',state:'liquid',density:1.00,amount:'100 mL',mass:100,jar:['#7CC0EA']},
  oil   :{name:'الزيت',state:'liquid',density:0.92,amount:'50 mL',mass:46,jar:['#E8B22E']},
  salt  :{name:'الملح',state:'solid',density:2.16,amount:'10 g',mass:10,dissolves:true,dissVol:3.2,dT:1.5,
         grain:{color:'#FFFFFF',size:2.8,count:70,sink:1.1,shape:'cube'},jar:['#F1F4F6','#B9C4CD','gr']},
  sugar :{name:'السكر',state:'solid',density:1.59,amount:'10 g',mass:10,dissolves:true,dissVol:6.3,dT:0.4,
         grain:{color:'#FBF6E6',size:3.4,count:55,sink:1,shape:'cube'},jar:['#FAF5E4','#D8C9A0','gr']},
  sand  :{name:'الرمل',state:'solid',density:2.65,amount:'30 g',mass:30,
         grain:{color:'#D4AE62',size:2.3,count:170,sink:.75,shape:'round'},jar:['#D8B36A','#A57D39','gr']},
  gravel:{name:'الحصى',state:'solid',density:2.60,amount:'40 g',mass:40,
         grain:{color:'#8E949B',size:9,count:14,sink:2.6,shape:'stone'},jar:['#A3A9B0','#6C737B','big']},
  iron  :{name:'برادة الحديد',state:'solid',density:7.87,amount:'20 g',mass:20,magnetic:true,
         grain:{color:'#3B3F46',size:2.2,count:120,sink:2.1,shape:'needle'},jar:['#545961','#1E2125','gr']}
};
const n=k=>M[k].name;
const d=k=>M[k].density.toFixed(2);

const ICON={
  goggles:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 20c6-3 34-3 40 0"/><rect x="6" y="18" width="16" height="13" rx="6" fill="var(--glass)" fill-opacity=".25"/><rect x="26" y="18" width="16" height="13" rx="6" fill="var(--glass)" fill-opacity=".25"/><path d="M22 24h4"/></svg>',
  gloves:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M15 42V24l-4-6a2.6 2.6 0 0 1 4.3-2.9L18 19V8a2.5 2.5 0 0 1 5 0v10-12a2.5 2.5 0 0 1 5 0v12-9a2.5 2.5 0 0 1 5 0v10-5a2.5 2.5 0 0 1 5 0v14c0 6-3 10-6 12v4z" fill="var(--glass)" fill-opacity=".2"/><path d="M15 42h18"/></svg>',
  stirrer:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M36 5 13 43"/><path d="M38 6 15 44" stroke="var(--glass)" stroke-width="1.2"/></svg>',
  magnet:'<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linejoin="round"><path d="M10 8v16a14 14 0 0 0 28 0V8h-8v16a6 6 0 0 1-12 0V8z" stroke="currentColor"/><path d="M10 8h8v7h-8z" fill="#C3473E" stroke="currentColor"/><path d="M30 8h8v7h-8z" fill="#3A6FB0" stroke="currentColor"/></svg>',
  filter:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 8h36L28 26v16h-8V26z"/><path d="M11 11h26L24 24z" fill="var(--paper)" stroke-dasharray="3 2"/></svg>',
  sepfunnel:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M20 3h8M21 3v5c-8 4-11 10-11 15a14 14 0 0 0 9 9v4h10v-4a14 14 0 0 0 9-9c0-5-3-11-11-15V3"/><path d="M12 20h24" stroke="#E8B22E"/><path d="M18 33h12M22 36v8h4v-8"/></svg>',
  burner:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M10 44h28l-4-6H14z"/><path d="M20 38V20h8v18"/><path d="M24 4c-4 5-6 8-4 12 1 2 7 2 8 0 2-4 0-7-4-12z" fill="#E8B22E" fill-opacity=".6"/></svg>',
  sieve:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4"><ellipse cx="24" cy="20" rx="18" ry="8"/><path d="M6 20c0 10 8 16 18 16s18-6 18-16M14 16l20 8M14 24l20-8M24 12v16"/><path d="M42 20h4"/></svg>'
};
const TOOLS={
  goggles  :{name:'نظارة الأمان',sub:'سلامة',safety:true},
  gloves   :{name:'القفازات',sub:'سلامة',safety:true},
  stirrer  :{name:'ساق التحريك',sub:'للتحريك'},
  magnet   :{name:'المغناطيس',sub:'أداة فصل',wrong:'المغناطيس يجذب المواد التي فيها حديد، لكنه لا يحرّك الخليط. اختر أداة للتحريك.'},
  filter   :{name:'ورق الترشيح',sub:'أداة فصل',wrong:'ورق الترشيح يفصل حبيبات صلبة عن سائل. نحن الآن في مرحلة الخلط وليس الفصل.'},
  sepfunnel:{name:'قمع الفصل',sub:'أداة فصل',wrong:'قمع الفصل يفصل سائلين لا يمتزجان. الآن نريد تحريك الخليط فقط.'},
  burner   :{name:'موقد بنزن',sub:'تسخين',wrong:'هذه التجربة لا تحتاج تسخينًا. تشغيل اللهب دون حاجة مخالف لقواعد السلامة.',unsafe:true},
  sieve    :{name:'المنخل',sub:'أداة فصل',wrong:'المنخل يفصل الحبيبات الكبيرة عن الصغيرة. الآن نريد التحريك.'}
};
function jarHTML(k){const j=M[k].jar;return `<span class="jar ${j[2]||''}" style="--c:${j[0]};--c2:${j[1]||j[0]}"><i></i></span>`}

/* =========================================================
   المفاهيم
   ========================================================= */
const CONCEPTS={
  het:'المخلوط غير المتجانس', hom:'المخلوط المتجانس (المحلول)', sol:'الذوبان',
  dens:'الكثافة والطفو والترسّب', prop:'احتفاظ مكونات المخلوط بخصائصها',
  sep:'طرق فصل المخاليط', obs:'دقة الملاحظة', safe:'الالتزام بالسلامة'
};

/* =========================================================
   محتوى موضوع «المخاليط»
   لإضافة موضوع جديد: أضف كائنًا مماثلًا إلى CONTENT
   واربطه بمحرك مناسب في ENGINES، ثم فعّله في TOPICS.
   ========================================================= */
const OBS_CHIPS={
  layers:'تكوّنت طبقتان منفصلتان', temp:'امتزجت المواد مؤقتًا أثناء التحريك',
  dissolve:'اختفت المادة الصلبة في السائل', settle:'ترسّبت حبيبات في القاع',
  visible:'يمكن تمييز المكونات بالعين', clear:'بقي السائل شفافًا',
  tchange:'تغيّرت درجة الحرارة قليلًا', color:'تغيّر لون المواد', gas:'تصاعدت فقاعات غاز'
};

const MIXTURES={
  id:'mixtures',
  title:'المخاليط',
  materials:['water','oil','salt','sugar','sand','gravel','iron'],
  tools:['goggles','gloves','stirrer','magnet','filter','sepfunnel','burner','sieve'],
  safety:['لا تتذوق أي مادة في المختبر، حتى لو بدت مألوفة.','ارتدِ النظارة والقفازات قبل لمس المواد.','نظّف أي سائل منسكب فورًا حتى لا ينزلق أحد.','لا تشعل الموقد إلا إذا طلبت التجربة ذلك.'],

  classify(a,b){
    const liq=[a,b].filter(k=>M[k].state==='liquid');
    if(liq.length===2) return {cls:'immiscible',first:'water',second:'oil',L:'water',S:'oil'};
    if(liq.length===1){
      const L=liq[0],S=L===a?b:a;
      return {cls:(L==='water'&&M[S].dissolves)?'solution':'sediment',first:L,second:S,L,S};
    }
    return {cls:'solids',first:a,second:b,A:a,B:b};
  },

  obs:{
    immiscible:{ok:['layers','temp'],neutral:['visible','clear']},
    solution  :{ok:['dissolve','clear'],neutral:['temp','tchange']},
    sediment  :{ok:['settle','visible'],neutral:['temp','clear']},
    solids    :{ok:['visible'],neutral:['temp']}
  },
  resultLabel:{
    immiscible:'طبقتان منفصلتان (مخلوط غير متجانس)',
    solution:'محلول (مخلوط متجانس)',
    sediment:'ترسّب المادة الصلبة (مخلوط غير متجانس)',
    solids:'مخلوط صلب غير متجانس'
  },

  /* ---- الأسئلة: [ملاحظة، تفسير، فصل] ثم موقف جديد ---- */
  questions(c){
    const Q={};
    Q.immiscible=[
      {type:'mcq',concept:'het',prompt:'ماذا لاحظت بعد أن توقف التحريك؟',
       options:[{t:'صعد الزيت وكوّن طبقة مستقلة فوق الماء',ok:1},{t:'امتزج الزيت بالماء وأصبحا سائلًا واحدًا'},{t:'نزل الزيت إلى قاع البيكر'},{t:'اختفى الزيت تمامًا'}],
       hints:['ارجع إلى ما لاحظته بعد توقف التحريك. هل بقي الزيت موزعًا في الماء؟','انظر إلى أعلى البيكر: هل يوجد سائل مختلف اللون فوق الماء؟'],
       explain:'بعد توقف التحريك صعدت قطرات الزيت وتجمّعت فوق الماء، فظهرت طبقتان يمكن تمييزهما بالعين.'},
      {type:'mcq',concept:'dens',prompt:'لماذا لم يمتزج الزيت بالماء، ولماذا استقر فوقه؟',
       options:[{t:'لأن الزيت لا يذوب في الماء، وكثافته (0.92 g/mL) أقل من كثافة الماء (1.00 g/mL)',ok:1},{t:'لأن الزيت أكثف من الماء فيضغط عليه'},{t:'لأن مدة التحريك كانت قصيرة'},{t:'لأن الماء بارد'}],
       hints:['تذكّر ما حدث أثناء التحريك: تفرّق الزيت إلى قطرات. هل بقيت القطرات موزعة بعد التوقف؟','قارن الكثافتين في لوحة القياسات. المادة الأقل كثافة تطفو فوق الأكثر كثافة.'],
       explain:'الزيت لا يذوب في الماء، فلا تنتشر جسيماته بين جسيمات الماء. ولأن كثافته أقل، تطفو قطراته وتتجمّع في الأعلى مهما حرّكت.'},
      {type:'tool',concept:'sep',prompt:'إذا أردت فصل الزيت عن الماء، فما الأداة المناسبة؟',
       options:[{tool:'sepfunnel',ok:1},{tool:'magnet'},{tool:'filter'},{tool:'burner'}],
       hints:['المكوّنان سائلان، وكل منهما في طبقة مستقلة.','تحتاج أداة يخرج منها السائل السفلي وحده من الأسفل، ثم تغلقها قبل وصول الزيت.'],
       explain:'قمع الفصل له صنبور في أسفله: نترك الطبقتين تنفصلان، ثم نفتح الصنبور فيخرج الماء أولًا، ونغلقه عند وصول الزيت.'}
    ];
    if(c.cls==='immiscible') return Q.immiscible;
    if(c.cls==='solution'){ Q.solution=[
      {type:'mcq',concept:'sol',prompt:`ماذا حدث لحبيبات ${n(c.S)} عندما حرّكت الخليط؟`,
       options:[{t:'اختفت تدريجيًا وتوزعت في الماء، أي ذابت',ok:1},{t:'ترسّبت وبقيت مرئية في القاع'},{t:'طفت وكوّنت طبقة فوق الماء'},{t:'تحوّلت إلى غاز وخرجت فقاعات'}],
       hints:[`انظر إلى قاع البيكر بعد التحريك: هل بقيت حبيبات ${n(c.S)}؟`,'الكتلة في لوحة القياسات لم تنقص. إذن المادة ما زالت في البيكر، لكن أين ذهبت؟'],
       explain:`ذاب ${n(c.S)} في الماء: تفكّكت حبيباته إلى جسيمات صغيرة جدًا لا تُرى، وتوزعت بانتظام بين جسيمات الماء. والدليل أن الكتلة الكلية بقيت ${(100+M[c.S].mass).toFixed(1)} g.`},
      {type:'classify',concept:'hom',prompt:'صنّف هذه المخاليط إلى متجانسة وغير متجانسة.',
       bins:['متجانس','غير متجانس'],
       items:[{t:`الماء و${n(c.S)} (تجربتك)`,bin:0},{t:'الماء والزيت',bin:1},{t:'الماء والرمل',bin:1},{t:'الهواء الذي نتنفسه',bin:0}],
       hints:['المخلوط المتجانس لا تستطيع تمييز مكوناته بالعين، ويبدو مادة واحدة في كل أجزائه.',`في تجربتك لم تعد ترى ${n(c.S)}. أما في الماء والرمل، فهل ترى الرمل؟`],
       explain:`محلول ${n(c.S)} في الماء والهواء مخلوطان متجانسان، لأن مكوناتهما موزعة بانتظام ولا تُميَّز بالعين. أما الماء مع الزيت أو الرمل فمكوناتهما تُرى منفصلة، فهما غير متجانسين.`},
      {type:'mcq',concept:'sep',prompt:`هل يمكن فصل ${n(c.S)} عن الماء باستخدام ورق الترشيح؟`,
       options:[{t:`لا، لأن جسيمات ${n(c.S)} الذائبة صغيرة جدًا فتمر مع الماء عبر الورق`,ok:1},{t:'نعم، فورق الترشيح يحجز كل المواد الصلبة'},{t:'نعم، إذا كان ورق الترشيح سميكًا'},{t:`لا، لأن ${n(c.S)} يتفاعل مع الورق`}],
       hints:[`ورق الترشيح يحجز الحبيبات التي يمكنك رؤيتها. هل كنت ترى حبيبات ${n(c.S)} بعد الذوبان؟`,'الجسيمات الذائبة أصغر بكثير من ثقوب ورق الترشيح.'],
       explain:`يمر المحلول كاملًا عبر ورق الترشيح لأن جسيمات ${n(c.S)} الذائبة أصغر من ثقوبه. لاسترجاع ${n(c.S)} نبخّر الماء بالتسخين.`}
    ]; return Q.solution; }
    if(c.cls==='sediment'){
    const ironInSed=c.S==='iron';
    Q.sediment=[
      {type:'mcq',concept:'het',prompt:`أين استقرت حبيبات ${n(c.S)} بعد توقف التحريك؟`,
       options:[{t:'في قاع البيكر، ويمكن رؤيتها',ok:1},{t:`ذابت واختفت في ${n(c.L)}`},{t:`طفت فوق سطح ${n(c.L)}`},{t:'بقيت موزعة في السائل ولم تستقر'}],
       hints:['ركّز على أسفل البيكر بعد انتهاء العد التنازلي.',`أثناء التحريك تحرّكت الحبيبات في ${n(c.L)}. ماذا فعلت عندما توقف التحريك؟`],
       explain:`لم يذب ${n(c.S)} في ${n(c.L)}، فهبطت حبيباته واستقرت في القاع، ويمكن تمييز المكونين بالعين؛ لذلك فهو مخلوط غير متجانس.`},
      {type:'mcq',concept:'dens',prompt:`ما سبب ترسّب ${n(c.S)} في القاع؟`,
       options:[{t:`لأنه لا يذوب في ${n(c.L)}، وكثافته (${d(c.S)} g/mL) أكبر من كثافة ${n(c.L)} (${d(c.L)} g/mL)`,ok:1},{t:`لأن كثافته أقل من كثافة ${n(c.L)}`},{t:'لأنه ذاب ثم عاد فظهر من جديد'},{t:`لأننا وضعناه بعد ${n(c.L)}`}],
       hints:[`هل اختفت حبيبات ${n(c.S)} في أي لحظة؟ هذا يخبرك هل ذاب أم لا.`,'قارن الكثافتين في لوحة القياسات: المادة الأكثف تهبط.'],
       explain:`${n(c.S)} لا يذوب في ${n(c.L)}، وكثافته أكبر، فتهبط حبيباته وتترسب.`+(c.L==='oil'&&M[c.S].dissolves?` لاحظ أن ${n(c.S)} يذوب في الماء لكنه لا يذوب في الزيت؛ فالذوبان يعتمد على المادتين معًا.`:'')},
      {type:'tool',concept:'sep',prompt:`ما الأداة المناسبة لفصل ${n(c.S)} عن ${n(c.L)}؟`+(ironInSed?' (قد توجد أكثر من إجابة صحيحة)':''),
       options:[{tool:'filter',ok:1},{tool:'magnet',ok:ironInSed?1:0},{tool:'sepfunnel'},{tool:'burner'}],
       hints:['المكوّن الصلب لم يذب، وما زالت حبيباته مرئية.','تحتاج أداة يمر منها السائل وتبقى الحبيبات فوقها.'+(ironInSed?' وتذكّر خاصية تميّز الحديد.':'')],
       explain:`ورق الترشيح يسمح بمرور ${n(c.L)} ويحجز حبيبات ${n(c.S)} لأنها أكبر من ثقوبه.`+(ironInSed?' ويمكن أيضًا استخدام المغناطيس لأن برادة الحديد تنجذب إليه.':'')}
    ]; return Q.sediment; }
    const pair=[c.A,c.B], has=k=>pair.includes(k);
    let method='none';
    if(has('iron')) method='magnet';
    else if(has('gravel')) method='sieve';
    else if(pair.filter(k=>M[k].dissolves).length===1) method='dissolve';
    const extraOk=has('iron')&&has('gravel')?'sieve':null;
    const methodHint={
      magnet:'إحدى المادتين لها خاصية مغناطيسية لا تملكها الأخرى.',
      sieve:'قارن حجم حبيبات الحصى بحجم حبيبات المادة الأخرى.',
      dissolve:'إحدى المادتين تذوب في الماء والأخرى لا تذوب.',
      none:'فكّر في كل طريقة: هل توجد خاصية بسيطة تختلف فيها المادتان بوضوح؟ كلتاهما تذوب في الماء.'
    }[method];

   ========================================================= */
const SIM=(()=>{
  const W=260,H=330,L=48,R=212,BOT=306,TOP=46,CAP=250,PX=(BOT-TOP-14)/CAP,NC=54,CW=(R-L)/NC;
  let cv,cx,raf=0,last=0,s=null,col={},onTick=null,tickAcc=0;
  const rnd=(a,b)=>a+Math.random()*(b-a);

  function readColors(){
    const cs=getComputedStyle(document.documentElement);
    col={ink:cs.getPropertyValue('--ink').trim()||'#13324A',ink2:cs.getPropertyValue('--ink-2').trim()||'#4F6879'};
  }
  function reset(){
    s={water:0,oilBase:0,oilLayer:0,drops:[],dropN0:1,grains:[],solids:{},pours:[],spawns:[],
       stirOn:false,stirT:0,stirDone:null,wob:0,t:0,colH:new Array(NC).fill(0)};
  }
  const hasWater=()=>s.water>0.01;
  const hasLiquid=()=>s.water>0.01||s.oilBase>0.01||s.oilLayer>0.01||s.drops.length>0;
  const dropVol=()=>s.drops.reduce((a,x)=>a+x.v,0);
  function solidVol(){
    if(!hasLiquid()) return 0;
    let v=0;
    for(const k in s.solids){const o=s.solids[k],m=M[k];
      const diss=diss_(k);
      v+=(1-diss)*o.mass/m.density + (m.dissolves&&hasWater()?diss*m.dissVol:0);
    }
    return v;
  }
  function diss_(k){
    const o=s.solids[k]; if(!o||!M[k].dissolves) return 0;
    if(o.spawned<o.n0) return 0;
    let a=0; for(const g of s.grains) if(g.k===k) a+=g.a;
    return Math.max(0,Math.min(1,1-a/o.n0));
  }
  const baseTop=()=>BOT-3-(s.water+s.oilBase+dropVol()+solidVol())*PX;
  const surfTop=()=>baseTop()-s.oilLayer*PX;

  function reading(){
    const liq=hasLiquid();
    let mass=s.water*1+(s.oilBase+s.oilLayer+dropVol())*0.92, temp=25;
    for(const k in s.solids){mass+=s.solids[k].mass; temp-=diss_(k)*(M[k].dT||0)}
    const vol=liq?s.water+s.oilBase+s.oilLayer+dropVol()+solidVol():null;
    return {vol,mass,temp,dissolved:Object.keys(s.solids).some(k=>diss_(k)>0.95)};
  }

  function addLiquid(k){return new Promise(res=>{s.pours.push({k,left:k==='water'?100:50,res})})}
  function addSolid(k){
    const m=M[k];
    s.solids[k]={mass:m.mass,n0:m.grain.count,spawned:0};
    return new Promise(res=>{s.spawns.push({k,left:m.grain.count,acc:0,res})});
  }
  function stir(sec){
    return new Promise(res=>{
      s.stirOn=true; s.stirT=sec; s.stirDone=res; s.colH.fill(0);
      for(const g of s.grains){g.settled=false;g.roll=0;g.rolls=0}
      if(hasWater()&&s.oilLayer>0.5){
        const cnt=Math.min(36,Math.max(8,Math.round(s.oilLayer/1.4))), v=s.oilLayer/cnt;
        s.oilLayer=0;
        for(let i=0;i<cnt;i++) s.drops.push({x:0,y:0,vx:0,vy:0,v,r:rnd(2.4,6),seed:Math.random()});
        const bt=baseTop();
        for(const dr of s.drops){dr.x=rnd(L+10,R-10);dr.y=rnd(bt+dr.r+2,BOT-dr.r-6)}
        s.dropN0=cnt;
      }
    });
  }

  function update(dt){
    s.t+=dt;
    for(let i=s.pours.length-1;i>=0;i--){const p=s.pours[i],dv=Math.min(p.left,85*dt);p.left-=dv;
      if(p.k==='water') s.water+=dv; else if(hasWater()) s.oilLayer+=dv; else s.oilBase+=dv;
      if(p.left<=0){s.pours.splice(i,1);setTimeout(p.res,250)}}
    for(let i=s.spawns.length-1;i>=0;i--){const sp=s.spawns[i],m=M[sp.k];
      sp.acc+=dt*m.grain.count/0.8;
      while(sp.acc>=1&&sp.left>0){sp.acc--;sp.left--;s.solids[sp.k].spawned++;
        s.grains.push({k:sp.k,x:150+rnd(-16,16),y:TOP-34+rnd(-8,8),vx:rnd(-25,25),vy:rnd(40,90),
          r:m.grain.size/2*rnd(.75,1.25),a:1,rot:rnd(0,3),seed:Math.random(),settled:false})}
      if(sp.left<=0){s.spawns.splice(i,1);setTimeout(sp.res,900)}}
    if(s.stirOn){s.stirT-=dt;s.wob=Math.min(1,s.wob+dt*3);
      if(s.stirT<=0){s.stirOn=false;const r=s.stirDone;s.stirDone=null;r&&r()}}
    else s.wob=Math.max(0,s.wob-dt*.7);

    const bt=baseTop(),st=surfTop(),liq=hasLiquid(),k3=Math.min(1,dt*3);
    for(let i=s.grains.length-1;i>=0;i--){
      const g=s.grains[i],m=M[g.k],sink=m.grain.sink;
      const inL=liq&&g.y>st, inWater=hasWater()&&g.y>bt;
      if(m.dissolves&&inWater){
        g.a-=(s.stirOn?.36:.025)*dt*(.7+.6*g.seed);
        if(g.a<=.06){s.grains.splice(i,1);continue}
      }
      if(g.settled&&!s.stirOn) continue;
      if(s.stirOn&&(inL||!liq)){
        g.settled=false;
        if(liq){const lift=1/sink;
          g.vx+=(Math.sin(s.t*4.2+g.y*.06+g.seed*6)*95*lift-g.vx)*k3;
          g.vy+=(Math.cos(s.t*3.3+g.x*.05+g.seed*4)*78*lift+14*sink-g.vy)*k3;
        }else{
          g.vx+=(Math.sin(s.t*(4+g.seed*3)+g.seed*6.28)*60+(150-g.x)*.35-g.vx)*Math.min(1,dt*4); g.vy+=420*dt;
        }
      }else{
        const tv=inL?24*sink:320;
        g.vy+=(tv-g.vy)*Math.min(1,dt*(inL?3:5));
        if(g.roll) g.vx=g.roll*(inL?24:60); else g.vx*=1-k3;
      }
      g.x+=g.vx*dt; g.y+=g.vy*dt; g.rot+=g.vx*dt*.05;
      const r=g.r*g.a;
      if(g.x<L+r+3){g.x=L+r+3;g.vx=Math.abs(g.vx)}
      if(g.x>R-r-3){g.x=R-r-3;g.vx=-Math.abs(g.vx)}
      if(s.stirOn&&liq&&inL&&g.y<st+r+1){g.y=st+r+1;g.vy=Math.abs(g.vy)}
      const c0=Math.max(0,Math.floor((g.x-r-L)/CW)),c1=Math.min(NC-1,Math.floor((g.x+r-L)/CW));
      let h=0; for(let c=c0;c<=c1;c++) h=Math.max(h,s.colH[c]);
      const rest=BOT-4-h-r;
      if(g.y>=rest){g.y=rest;
        if(!s.stirOn){
          // زاوية الاستقرار (~32°): إن كان الميل أشد تتدحرج الحبيبة إلى الجهة الأخفض
          const cl=c0>0?s.colH[c0-1]:1e9, cl2=c0>1?s.colH[c0-2]:cl, cr=c1<NC-1?s.colH[c1+1]:1e9, cr2=c1<NC-2?s.colH[c1+2]:cr;
          const step=CW*.62, dL=Math.max(h-cl-step,h-cl2-2*step), dR=Math.max(h-cr-step,h-cr2-2*step);
          if(Math.max(dL,dR)>0&&(g.rolls=(g.rolls||0)+1)<400){g.roll=dL>dR?-1:dR>dL?1:(Math.random()<.5?-1:1);g.vy=0}
          else{g.roll=0;g.settled=true;g.vx=0;g.vy=0;
            const add=Math.max(Math.PI*r*r/.62/((c1-c0+1)*CW),r*1.2);
            for(let c=c0;c<=c1;c++) s.colH[c]=h+add}
        }
        else g.vy=-Math.abs(g.vy)*.35-(liq?0:rnd(30,90));
      }
    }
    for(let i=s.drops.length-1;i>=0;i--){const dr=s.drops[i];
      if(s.stirOn){
        dr.vx+=(Math.sin(s.t*4.2+dr.y*.06+dr.seed*6)*110-dr.vx)*k3;
        dr.vy+=(Math.cos(s.t*3.3+dr.x*.05+dr.seed*4)*90-dr.vy)*k3;
      }else{dr.vy+=(-(16+dr.r*7)-dr.vy)*Math.min(1,dt*2);dr.vx*=1-Math.min(1,dt*2)}
      dr.x+=dr.vx*dt; dr.y+=dr.vy*dt;
      if(dr.x<L+dr.r+3){dr.x=L+dr.r+3;dr.vx=Math.abs(dr.vx)}

        for(let j=0;j<10;j++)c.lineTo(132+i*18+Math.sin(t*3+j*.8+i)*5,178-ph*90-j*5);c.stroke()}}
      c.direction='ltr';c.fillStyle=col.ink;c.font='700 16px "IBM Plex Sans Arabic",sans-serif';c.textAlign='left';c.fillText(`${temp.toFixed(0)} °C`,18,32);
      c.font='500 12px "IBM Plex Sans Arabic",sans-serif';c.fillStyle=col.ink2;c.fillText(`الماء: ${(d.ct.water*rem).toFixed(0)} mL`,18,52);}},
    funnel:{dur:0,draw(d,p,t){drawFunnel(d.st,t)}}
  };

  function loop(now){
    const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
    c.clearRect(0,0,W,H);
    if(sc){sc.t+=dt;
      if(sc.kind==='funnel'){const st=sc.data.st;
        if(st.rate>0){let dv=st.rate*dt;const a=Math.min(dv,st.fw);st.fw-=a;st.rw+=a;dv-=a;const b=Math.min(dv,st.fo);st.fo-=b;st.ro+=b}
        sc.data.onTick&&sc.data.onTick(st)}
      const p=SC[sc.kind].dur?clamp(sc.t/SC[sc.kind].dur):0;
      SC[sc.kind].draw(sc.data,p,sc.t);
      if(SC[sc.kind].dur&&p>=1&&sc.res){const r=sc.res;sc.res=null;setTimeout(r,350)}
    }
    raf=requestAnimationFrame(loop);
  }
  function mount(canvas){cancelAnimationFrame(raf);cv=canvas;c=cv.getContext('2d');
    const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);
    readColors();sc=null;last=performance.now();raf=requestAnimationFrame(loop)}
  function play(kind,data){return new Promise(res=>{sc={kind,data,t:0,res}})}
  function idle(ct){sc={kind:'idle',data:{ct},t:0}}
  function funnel(init,onTick){const st={fw:init.water,fo:init.oil,rw:0,ro:0,rate:0};sc={kind:'funnel',data:{st,onTick},t:0};return st}
  function setRate(r){if(sc&&sc.kind==='funnel')sc.data.st.rate=r}
  function stop(){cancelAnimationFrame(raf);sc=null}
  return {mount,play,idle,funnel,setRate,stop,readColors};
})();

function solidsMethod(a,b){const s=[a,b];if(s.includes('iron'))return'magnet';if(s.includes('gravel'))return'sieve';
  if(s.filter(k=>M[k].dissolves).length===1)return'dissolve';return'none'}
function sepTargets(c){
  if(c.cls==='immiscible')return['water','oil'];
  if(c.cls==='solution')return[c.S];
  if(c.cls==='sediment')return[c.S,c.L];
  return solidsMethod(c.A,c.B)==='none'?[]:[c.A,c.B];
}
const ctComps=ct=>[...(ct.water>3.1?['water']:[]),...(ct.oil>3.1?['oil']:[]),...Object.keys(ct.solids).filter(k=>ct.solids[k].g>0.05)];
function ctText(ct){const p=[];if(ct.water>0.5)p.push(`ماء ${ct.water.toFixed(0)} mL`);if(ct.oil>0.5)p.push(`زيت ${ct.oil.toFixed(0)} mL`);
  for(const k in ct.solids){const s=ct.solids[k];if(s.g>0.05)p.push(`${n(k)} ${s.g.toFixed(1)} g${s.dis?' (ذائب)':''}`)}return p.join('، ')||'فارغ'}

function startSeparation(){
  const r=APP.run,c=r.ctx,ct={water:0,oil:0,solids:{}};
  for(const k of [c.first,c.second]){if(k==='water')ct.water=100;else if(k==='oil')ct.oil=50;else ct.solids[k]={g:M[k].mass,dis:c.cls==='solution'}}
  r.sep={work:ct,out:[],steps:[],actions:[],wrong:0,busy:false,done:false,funnel:false,targets:sepTargets(c),msg:''};
  go('separate');
}
function sepDone(){const s=APP.run.sep,all=[s.work,...s.out.map(o=>o.ct)];
  return s.targets.length>0&&s.targets.every(t=>all.some(ct=>{const cm=ctComps(ct);return cm.length===1&&cm[0]===t}))}
function nextToolName(){
  const s=APP.run.sep,W=s.work,und=Object.keys(W.solids).filter(k=>!W.solids[k].dis);
  if(!s.targets.length)return 'زر «لا يمكن الفصل بهذه الأدوات»';
  if(W.water>3&&W.oil>3)return TOOLS.sepfunnel.name;
  if(W.solids.iron)return TOOLS.magnet.name;
  if(W.solids.gravel)return TOOLS.sieve.name;
  const solU=und.filter(k=>M[k].dissolves);
  if(solU.length&&W.water<0.5&&W.oil<0.5)return 'إضافة الماء من رف المواد';
  if(solU.length&&W.water>0.5)return TOOLS.stirrer.name;
  if(und.length&&(W.water>0.5||W.oil>0.5))return TOOLS.filter.name;
  return TOOLS.burner.name;
}
function sepWrong(msg,unsafe){
  const r=APP.run,s=r.sep;s.wrong++;r.log.push('فصل: '+msg);
  if(unsafe)logMistake('safety','حاول تسخين الزيت على لهب مكشوف');
  note(msg+(s.wrong>=2?` تلميح: جرّب ${nextToolName()}.`:''),true);
}
function normalizeWork(){
  const s=APP.run.sep;
  if(ctComps(s.work).length<=1){const i=s.out.findIndex(o=>ctComps(o.ct).length>1&&o.ct.water<0.5);
    if(i>=0){const o=s.out.splice(i,1)[0];if(ctComps(s.work).length)s.out.push({label:'ناتج جانبي',ct:s.work});s.work=o.ct;SEP.idle(s.work)}}
}
function afterStep(msg){
  const s=APP.run.sep;normalizeWork();
  if(sepDone()){s.done=true;s.msg=msg}else s.msg=msg+' ما الخطوة التالية؟';
  sepGuide();refreshSepOut();
}
function refreshSepOut(st){
  const s=APP.run.sep,box=$('#sepOut');if(!box)return;
  const card=(label,ct,ok)=>`<div class="reading"><span>${label}${ok?' ✓':''}</span><b style="font-size:.95rem;line-height:1.4">${bidi(ctText(ct))}</b></div>`;
  const pure=ct=>{const cm=ctComps(ct);return cm.length===1&&s.targets.includes(cm[0])};
  let h='<div class="dens" style="border-style:solid"><b>حصيلة الفصل</b></div>';
  if(st) h+=card('في القمع',{water:st.fw,oil:st.fo,solids:{}})+card('في الكأس',{water:st.rw,oil:st.ro,solids:{}});
  else{h+=card(s.done?(s.workLabel||'في البيكر'):'الخليط الحالي',s.work,pure(s.work));s.out.forEach(o=>h+=card(o.label,o.ct,pure(o.ct)))}
  box.innerHTML=h;
}
function sepGuide(){
  const r=APP.run,s=r.sep,t=$('#gtext'),act=$('#gact');if(!t)return;act.innerHTML='';
  if(s.funnel){t.textContent='افتح الصنبور ليخرج الماء، وأغلقه لحظة وصول الحد الفاصل بين الطبقتين إلى الصنبور. قرب النهاية افتحه قليلًا.';
    act.innerHTML='<button class="btn amber" data-r="9">افتح كاملًا</button><button class="btn amber" data-r="2.5">افتح قليلًا</button><button class="btn" data-r="0" style="background:var(--paper);color:var(--ink)">أغلق الصنبور</button>';
    $$('[data-r]',act).forEach(b=>b.onclick=()=>{const v=+b.dataset.r;SEP.setRate(v);if(v===0)funnelClosed()});return}

    act.innerHTML='<button class="btn amber" id="toLearn">إلى الخلاصة</button>';$('#toLearn').onclick=()=>go('learned');return}
  t.textContent=bidi(s.msg)||'الآن افصل مكونات الخليط عمليًا. اسحب الأداة المناسبة إلى البيكر.';
  act.innerHTML='<button class="btn" id="noSep" style="background:transparent;border:1px solid currentColor;color:inherit;padding:6px 12px">لا يمكن الفصل بهذه الأدوات</button>';
  $('#noSep').onclick=()=>{
    if(s.busy||s.done)return;
    s.actions.push({t:'none'});
    if(!s.targets.length){s.done=true;s.steps.push('الاستنتاج: لا توجد طريقة بسيطة لفصل المادتين');
      s.msg='استنتاجك صحيح: كلتا المادتين تذوب في الماء، ولا تنجذب للمغناطيس، وحبيباتهما متقاربة الحجم؛ فلا تفصلهما هذه الأدوات.';sepGuide();refreshSepOut()}
    else sepWrong('يمكن فصل هذا الخليط. فكّر في خاصية تختلف فيها المكونات.');
  };
}
function funnelClosed(){
  const r=APP.run,s=r.sep,st=s.fst;if(!st)return;
  if(st.ro>3){s.wrong++;r.log.push(`فصل: تسرّب ${st.ro.toFixed(1)} mL زيت إلى كأس الماء`);
    note(`تسرّب ${st.ro.toFixed(1)} mL من الزيت إلى كأس الماء، فالفصل غير نقي. أعدنا التجربة: افتح الصنبور قليلًا عندما يقترب الحد الفاصل.`,true);
    s.fst=SEP.funnel({water:s.work.water,oil:s.work.oil},x=>{s.fst=x;if(s.funnel)refreshSepOut(x)});return}
  if(st.fw>3){note(`بقي في القمع نحو ${st.fw.toFixed(0)} mL من الماء. افتح الصنبور مجددًا.`);return}
  s.funnel=false;s.busy=false;
  s.out.push({label:'في الكأس',ct:{water:st.rw,oil:st.ro,solids:{}}});
  s.work={water:st.fw,oil:st.fo,solids:{}};s.workLabel='في القمع';
  s.steps.push(`قمع الفصل: ${st.rw.toFixed(0)} mL ماء في الكأس، و${st.fo.toFixed(0)} mL زيت بقيت في القمع`);
  afterStep(`انفصل السائلان: ${st.rw.toFixed(0)} mL ماء في الكأس، و${st.fo.toFixed(0)} mL زيت في القمع.`);
}
async function sepTool(t){
  const r=APP.run,s=r.sep;if(s.busy||s.done||s.funnel)return;
  if(!TOOLS[t].safety)s.actions.push({t});
  const W=s.work,und=Object.keys(W.solids).filter(k=>!W.solids[k].dis&&W.solids[k].g>0.05),dis=Object.keys(W.solids).filter(k=>W.solids[k].dis);
  const liq=W.water>0.5||W.oil>0.5;
  r.tools.add(TOOLS[t].name);
  const run=async(kind,data)=>{s.busy=true;sepGuide();await SEP.play(kind,data);s.busy=false};
  if(TOOLS[t].safety){note('أنت ترتدي معدات السلامة.');return}
  if(t==='sepfunnel'){
    if(W.water>3&&W.oil>3){s.funnel=true;s.busy=true;s.fst=SEP.funnel({water:W.water,oil:W.oil},x=>{s.fst=x;if(s.funnel)refreshSepOut(x)});sepGuide();return}
    return sepWrong('قمع الفصل يفصل سائلين لا يمتزجان، وهذا الخليط ليس كذلك.');
  }
  if(t==='filter'){
    if(!liq)return sepWrong('الترشيح يحتاج سائلًا يمر عبر الورق، وهذا الخليط صلب كله.');
    if(!und.length&&W.water>3&&W.oil>3)return sepWrong('الماء والزيت كلاهما يمر عبر ورق الترشيح، فلن ينفصلا.');
    const residue={water:0,oil:0,solids:{}};und.forEach(k=>residue.solids[k]={...W.solids[k]});
    const ret=und.length?(und.includes('sand')?4:2):0;
    const filtrate={water:Math.max(0,W.water-(W.water>0.5?ret:0)),oil:Math.max(0,W.oil-(W.water>0.5?0:ret)),solids:{}};
    dis.forEach(k=>filtrate.solids[k]={...W.solids[k]});
    await run('filter',{src:W,residue,filtrate});
    s.work=filtrate;SEP.idle(filtrate);
    if(und.length){s.out.push({label:'على ورق الترشيح (رطب)',ct:residue});
      s.steps.push(`الترشيح: بقي ${ctText(residue)} على الورق، ومرّ ${ctText(filtrate)}`);
      afterStep(`مرّ السائل عبر الورق وبقيت الحبيبات فوقه. الراشح أقل بنحو ${ret} mL لأن الورق والحبيبات الرطبة احتجزتها.`)}
    else{s.steps.push('الترشيح: مرّ الخليط كله ولم يبقَ شيء على الورق');sepGuide();refreshSepOut();
      sepWrong('مرّ الخليط كله عبر الورق ولم يبقَ شيء فوقه؛ المادة الذائبة لا يحجزها ورق الترشيح.')}
    return;
  }
  if(t==='magnet'){
    const has=!!W.solids.iron;await run('magnet',{ct:W,has});
    if(has){const iron={water:0,oil:0,solids:{iron:{...W.solids.iron}}};delete W.solids.iron;
      s.out.push({label:'على المغناطيس',ct:iron});SEP.idle(W);
      s.steps.push(`المغناطيس: جذب ${iron.solids.iron.g.toFixed(1)} g من برادة الحديد`);
      afterStep(`انجذبت ${iron.solids.iron.g.toFixed(1)} g من برادة الحديد إلى المغناطيس، وبقي الباقي مكانه.`)}
    else{SEP.idle(W);s.steps.push('المغناطيس: لم ينجذب شيء');sepGuide();refreshSepOut();sepWrong('لم ينجذب شيء؛ لا توجد في الخليط مادة مغناطيسية.')}
    return;
  }
  if(t==='sieve'){
    const has=!!W.solids.gravel,kept=has?{water:0,oil:0,solids:{gravel:{...W.solids.gravel}}}:null;
    const passed=JSON.parse(JSON.stringify(W));delete passed.solids.gravel;
    await run('sieve',{src:W,kept,passed});
    s.work=passed;SEP.idle(passed);
    if(has){s.out.push({label:'فوق المنخل',ct:kept});s.steps.push(`المنخل: بقي ${kept.solids.gravel.g.toFixed(1)} g حصى فوقه`);
      afterStep('بقي الحصى فوق المنخل لأن حبيباته أكبر من ثقوبه، ومرّ الباقي.')}
    else{s.steps.push('المنخل: مرّ كل شيء');sepGuide();refreshSepOut();sepWrong('مرّ كل شيء عبر ثقوب المنخل؛ الحبيبات أصغر من ثقوبه.')}
    return;
  }
  if(t==='burner'){
    if(W.oil>0.5)return sepWrong('خطر! لا تسخّن الزيت على لهب مكشوف؛ قد يشتعل.',true);
    if(W.water<0.5)return sepWrong('لا يوجد ماء ليتبخر، فالتسخين لا يفيد هنا.');
    if(und.length&&dis.length)return sepWrong('في الخليط حبيبات لم تذب. لو بخّرت الآن لاختلطت بالبلورات؛ افصلها أولًا.');
    if(!dis.length)return sepWrong('لا توجد مادة ذائبة لنسترجعها؛ التبخير هنا يهدر الماء. توجد طريقة أبسط تحتفظ بالماء.');
    await run('evap',{ct:W,cryst:dis});
    const cr={water:0,oil:0,solids:{}};dis.forEach(k=>cr.solids[k]={g:W.solids[k].g,dis:false});
    s.steps.push(`التبخير: تبخّر ${W.water.toFixed(0)} mL ماء وبقي ${ctText(cr)}`);
    s.work=cr;s.workLabel='في الجفنة';
    afterStep(dis.length>1?'تبخّر الماء، لكن البلورات المتبقية خليط من المادتين!':
      `تبخّر ${W.water.toFixed(0)} mL من الماء وبقي ${cr.solids[dis[0]].g.toFixed(1)} g من بلورات ${n(dis[0])}. الماء نفسه لم نسترجعه؛ لاسترجاعه نحتاج التقطير.`+(dis.includes('sugar')?' في المختبر الحقيقي نسخّن السكر بهدوء، فالحرارة الشديدة تحرقه.':''));
    return;
  }
  if(t==='stirrer'){
    const sol=und.filter(k=>M[k].dissolves);
    if(W.water>0.5&&sol.length){await run('stir',{ct:W,fade:sol});sol.forEach(k=>W.solids[k].dis=true);SEP.idle(W);
      s.steps.push(`الإذابة: ذاب ${sol.map(n).join(' و')} في الماء`);afterStep(`ذاب ${sol.map(n).join(' و')} في الماء، وبقي ما لا يذوب.`)}
    else sepWrong('التحريك يخلط المكونات ولا يفصلها.');
  }
}
async function sepMat(k){
  const r=APP.run,s=r.sep;if(s.busy||s.done||s.funnel)return;
  const W=s.work;
  if(k!=='water')return note('هذه المادة ليست مطلوبة في الفصل.');
  s.actions.push({t:'water'});
  if(W.water>0.5)return note('الخليط فيه ماء بالفعل.');
  if(W.oil>0.5)return sepWrong('إضافة الماء إلى الزيت تصنع خليطًا جديدًا ولا تفصل شيئًا.');
  if(!Object.keys(W.solids).some(x=>M[x].dissolves&&!W.solids[x].dis))return sepWrong('لن يذوب أي من المكونين في الماء، فإضافته لا تساعد على الفصل.');
  s.busy=true;sepGuide();await SEP.play('pour',{ct:W});s.busy=false;W.water=100;SEP.idle(W);
  s.steps.push('أضاف 100 mL ماء');afterStep('أضفت 100 mL من الماء.');
}

/* =========================================================
   السحب والإفلات (يعمل باللمس والفأرة) + بديل النقر
   ========================================================= */
function draggable(el,{onDrop,onTap,zones='[data-zone]'}){
  let sx=null,sy=0,ghost=null,lastZone=null;
  const zoneAt=(x,y)=>{const t=document.elementFromPoint(x,y);return t?t.closest(zones):null};
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;sx=e.clientX;sy=e.clientY;try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{
    if(sx===null)return;
    if(!ghost&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){ghost=el.cloneNode(true);ghost.classList.add('dragghost');ghost.removeAttribute('id');document.body.appendChild(ghost)}
    if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
      const z=zoneAt(e.clientX,e.clientY); if(z!==lastZone){lastZone&&lastZone.classList.remove('hot');z&&z.classList.add('hot');lastZone=z}}
  });
  const end=(e,cancel)=>{
    if(sx===null)return; sx=null;
    if(ghost){ghost.remove();ghost=null;lastZone&&lastZone.classList.remove('hot');
      el._dragEnd=Date.now();
      if(!cancel){const z=zoneAt(e.clientX,e.clientY);if(z)onDrop&&onDrop(z,e.clientX,e.clientY)}
      lastZone=null}
  };
  el.addEventListener('pointerup',e=>end(e,false));
  el.addEventListener('pointercancel',e=>end(e,true));
  el.addEventListener('click',()=>{if(el._dragEnd&&Date.now()-el._dragEnd<400)return;onTap&&onTap()});
}

function matAct(k,dropped){
  const r=APP.run,c=r.ctx;
  if(r.step==='safety'){logMistake('safety','لمس المواد قبل ارتداء معدات السلامة');note('توقف! ارتدِ النظارة والقفازات أولًا قبل لمس أي مادة.',true);return}
  if(r.step==='choose'){
    if(r.fixed){note(`المادتان في تجربة اليوم محددتان من معلمك: ${n(r.fixed[0])} و${n(r.fixed[1])}.`);return}
    if(r.sel.includes(k)) r.sel=r.sel.filter(x=>x!==k);
    else if(r.sel.length<2) r.sel.push(k);
    else note('اخترت مادتين بالفعل. أزل إحداهما إن أردت التبديل.');
    setGuide(); return;
  }
  if(r.step==='addFirst'||r.step==='addSecond'){
    const want=r.step==='addFirst'?c.first:c.second;
    if(k===want){
      const isFirst=r.step==='addFirst'; r.step='busy'; setGuide();
      const p=M[k].state==='liquid'?SIM.addLiquid(k):SIM.addSolid(k);
      p.then(()=>{r.step=isFirst?'addSecond':'stir';setGuide()});
      return;
    }
    if(r.sel.includes(k)){logMistake('exec',`ترتيب خاطئ: أضاف ${n(k)} قبل ${n(want)}`);note(`ابدأ بـ${n(want)} أولًا. الترتيب يساعدك على ملاحظة ما يحدث بوضوح.`,true)}
    else{logMistake('exec',`أضاف مادة خارج اختياره: ${n(k)}`);note(`${n(k)} ليس ضمن المادتين اللتين اخترتهما. التزم بخطة التجربة.`,true)}
    return;
  }
  note('أكمل الخطوة الحالية أولًا.');
}

function toolAct(t){
  const r=APP.run,T=TOOLS[t];
  if(T.safety){
    if(r.worn[t]){note(`أنت ترتدي ${T.name} بالفعل.`);return}
    r.worn[t]=true; r.tools.add(T.name);
    if(r.step==='safety'&&r.worn.goggles&&r.worn.gloves){r.step='choose';if(r.fixed)r.sel=r.fixed.slice();note('ممتاز، أنت جاهز للعمل بأمان.')}
    setGuide(); return;
  }
  if(r.step==='safety'){note('ارتدِ معدات السلامة أولًا.');return}
  if(r.step==='stir'){
    if(t==='stirrer'){
      r.tools.add(T.name); r.step='stirring'; setGuide();
      SIM.stir(3.6).then(()=>{
        r.step='watch'; setGuide();
        let left=6; const tick=()=>{const g=$('#gtext'); if(!g||r.step!=='watch')return;
          g.textContent=`توقّف التحريك. راقب البيكر جيدًا… ${left}`;
          if(left--<=0){r.step='observe';setGuide();renderObs();return} setTimeout(tick,1000)};
        tick();
      });
      return;
    }
    r.tools.add(T.name); logMistake('tool',`استخدم ${T.name} بدل ساق التحريك`);
    if(T.unsafe) logMistake('safety','حاول تشغيل الموقد دون حاجة');
    note(T.wrong,true); return;
  }
  if(t==='stirrer'){
    if(['stirring','watch'].includes(r.step)){note('انتظر وراقب ما يحدث.');return}
    if(r.step==='observe'){note('سجّل ملاحظاتك أولًا.');return}
    note('ضع المادتين في البيكر أولًا، ثم حرّك.');return;
  }
  note(`${T.name}: ستحتاجه في مواقف الفصل. ركّز الآن على خطوات التجربة.`);
}

/* ---------- محرك الأسئلة ---------- */
function renderQuestion(host,q,onDone){
  let tries=0,done=false;const alog=[];
  host.innerHTML=`<div class="qcard"><p class="qprompt">${q.prompt}</p>
    <div class="tries" aria-label="المحاولات"><span>المحاولات</span><i></i><i></i><i></i></div>
    <div class="qbody"></div><div class="fb" aria-live="polite"></div><div class="next"></div></div>`;
  const body=$('.qbody',host),fb=$('.fb',host),nx=$('.next',host),wrongs=[];
  const dots=()=>$$('.tries i',host).forEach((x,i)=>x.classList.toggle('used',i<tries));
  function fail(extra){
    tries++; dots();
    if(tries<3){fb.innerHTML=`<div class="hint"><b>تلميح ${tries===1?'':'أوضح'}</b>${extra?extra+' ':''}${q.hints[tries-1]}</div>`;return}
    finish(false);
  }
  function finish(ok){
    done=true; reveal&&reveal();
    fb.innerHTML=`<div class="explain"><b>${ok?(tries===0?'أحسنت! اكتشفتها من أول محاولة.':'أحسنت! وصلت إليها بنفسك.'):'لنفهمها معًا'}</b>${q.explain}</div>`;
    nx.innerHTML='<button class="btn">التالي</button>';
    $('button',nx).onclick=()=>onDone({prompt:q.prompt,concept:q.concept,attempts:ok?tries+1:3,correct:ok,wrongs,log:alog.slice(0,3)});
    $('button',nx).focus();
  }
  let reveal=null;
  if(q.type==='mcq'||q.type==='tool'){
    const opts=shuffle(q.options.map((o,i)=>({...o,_i:i})));
    body.innerHTML=`<div class="opts ${q.type==='tool'?'toolgrid':''}">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.tool?ICON[o.tool]+`<span>${TOOLS[o.tool].name}</span>`:o.t}</button>`).join('')}</div>`;
    const btns=$$('.opt',body);
    reveal=()=>{btns.forEach((bt,i)=>{bt.disabled=true;if(opts[i].ok)bt.classList.add('right')})};
    btns.forEach((bt,i)=>bt.addEventListener('click',()=>{
      if(done)return; const o=opts[i]; alog.push(o._i);
      if(o.ok){bt.classList.add('right');finish(true)}
      else{bt.classList.add('wrong');bt.disabled=true;wrongs.push(o.t||TOOLS[o.tool].name);fail()}
    }));
  }
  if(q.type==='order'){
    const pool=shuffle(q.items.map((t,i)=>({t,i}))); let seq=[];
    const draw=()=>{
      body.innerHTML=`<div class="seq">${q.items.map((_,j)=>`<div class="slot ${seq[j]?'filled':''}" data-j="${j}">${seq[j]?seq[j].t:''}</div>`).join('')}</div>
        <div class="pool">${pool.filter(p=>!seq.includes(p)).map(p=>`<button class="chip" data-p="${p.i}">${p.t}</button>`).join('')}</div>
        <div class="next" style="justify-content:flex-start"><button class="btn" id="chk" ${seq.length<q.items.length||done?'disabled':''}>تحقّق من الترتيب</button></div>`;
      if(done){$('#chk',body).remove();return}
      $$('[data-p]',body).forEach(x=>x.onclick=()=>{seq.push(pool.find(p=>p.i==x.dataset.p));draw()});
      $$('.slot.filled',body).forEach(x=>x.onclick=()=>{seq.splice(+x.dataset.j,1);draw()});
      $('#chk',body).onclick=()=>{
        alog.push(seq.map(p=>p.i));
        const right=seq.filter((p,j)=>p.i===j).length;
        if(right===q.items.length){finish(true);draw()}
        else{wrongs.push(seq.map(p=>p.t).join(' ← '));fail(`${right} من ${q.items.length} خطوات في مكانها الصحيح.`);if(done)draw()}
      };
    };
    reveal=()=>{seq=q.items.map((t,i)=>({t,i}))};
    draw();
  }
  if(q.type==='classify'){
    const items=shuffle(q.items.map((x,i)=>({...x,i}))); const place={}; let active=null;
    const draw=()=>{
      body.innerHTML=`<div class="bins">${q.bins.map((bn,bi)=>`<div class="bin" data-bin="${bi}" role="button" tabindex="0" aria-label="${bn}"><h4>${bn}</h4>${items.filter(it=>place[it.i]===bi).map(it=>`<button class="chip card-chip ${active===it.i?'active':''}" data-it="${it.i}">${it.t}</button>`).join('')}</div>`).join('')}</div>
        <div class="pool">${items.filter(it=>place[it.i]===undefined).map(it=>`<button class="chip card-chip ${active===it.i?'active':''}" data-it="${it.i}">${it.t}</button>`).join('')}</div>
        <p class="note">اسحب كل بطاقة إلى مكانها، أو انقر البطاقة ثم انقر المجموعة.</p>
        <div class="next" style="justify-content:flex-start"><button class="btn" id="chk" ${Object.keys(place).length<items.length||done?'disabled':''}>تحقّق من التصنيف</button></div>`;
      if(done){$('#chk',body).remove();$$('.chip',body).forEach(c=>c.disabled=true);return}
      $$('[data-it]',body).forEach(x=>draggable(x,{zones:'[data-bin]',onDrop:z=>{place[+x.dataset.it]=+z.dataset.bin;active=null;draw()},onTap:()=>{active=active===+x.dataset.it?null:+x.dataset.it;draw()}}));
      $$('[data-bin]',body).forEach(z=>{const put=()=>{if(active===null)return;place[active]=+z.dataset.bin;active=null;draw()};
        z.addEventListener('click',e=>{if(e.target.closest('[data-it]'))return;put()});
        z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();put()}})});
      $('#chk',body).onclick=()=>{
        alog.push(q.items.map((_,j)=>place[j]));
        const wrong=items.filter(it=>place[it.i]!==it.bin);
        if(!wrong.length){finish(true);draw()}
        else{wrongs.push(wrong.map(w=>w.t).join('، '));fail(tries>=1?`${wrong.length} ${wrong.length===1?'بطاقة':'بطاقات'} في المجموعة الخطأ.`:'');if(done)draw()}
      };
    };
    reveal=()=>{items.forEach(it=>place[it.i]=it.bin);active=null};
    draw();
  }
}

function computeScore(r){
  if(CONTENT[r.topic].score) return CONTENT[r.topic].score(r);
  const f=a=>a&&a.correct?[0,1,.6,.3][a.attempts]:0, q=r.answers;
  const parts=[
    ['الالتزام بالسلامة',Math.max(0,10-5*r.mist.safety),10],
    ['اختيار المواد',5,5],
    ['اختيار الأدوات',Math.max(0,5-2*r.mist.tool),5],
    ['الفصل العملي',r.sep&&(r.sep.done)?Math.max(0,10-2.5*r.sep.wrong):0,10],
    ['تنفيذ التجربة',Math.max(0,15-4*r.mist.exec),15],
    ['دقة الملاحظة',15*r.obsScore,15],
    ['الإجابات',10*f(q[0])+10*f(q[2]),20],
    ['تفسير النتيجة',10*f(q[1]),10],
    ['التطبيق في موقف جديد',10*f(q[3]),10]
  ];
  const total=Math.round(parts.reduce((a,p)=>a+p[1],0));
  const byC={};
  q.forEach(a=>{if(!a)return;const ok=a.correct&&a.attempts===1;byC[a.concept]=byC[a.concept]===undefined?ok:byC[a.concept]&&ok});
  byC.obs=r.obsScore>=.8; byC.safe=r.mist.safety===0;
  return {parts,total,mastered:Object.keys(byC).filter(k=>byC[k]),reinforce:Object.keys(byC).filter(k=>!byC[k])};
}
function gradeWord(t){return t>=90?'ممتاز':t>=75?'جيد جدًا':t>=60?'جيد':'تحتاج إلى مراجعة'}
function suggestNext(r){
  if(CONTENT[r.topic].next) return CONTENT[r.topic].next(r);
  const C=CONTENT[r.topic],ex=explored(),cur=r.ctx.cls,mats=C.materials,cands=[];
  for(let i=0;i<mats.length;i++)for(let j=i+1;j<mats.length;j++){const a=mats[i],b=mats[j];
    if(ex.includes(pairKey(a,b)))continue; cands.push({a,b,cls:C.classify(a,b).cls})}
  const pick=cands.find(x=>x.cls!==cur)||cands[0];
  if(!pick) return 'جرّبت كل التركيبات الممكنة. أنت مستكشف حقيقي!';
  if(pick.a==='oil'||pick.b==='oil'){const o=pick.a==='oil'?pick.b:pick.a; if(M[o].dissolves) return `جرّب ${n(o)} مع الزيت: هل سيذوب كما يذوب في الماء؟`}
  return `جرّب ${n(pick.a)} مع ${n(pick.b)}: هل ستكون النتيجة مثل تجربتك هذه؟`;
}

/* =========================================================
   ⚙️ تجربة قوة الاحتكاك
   ثلاثة مسارات: منحدر منحنٍ أملس ومتماثل (المتغير المضبوط)
   يتبعه سطح أفقي مختلف الخشونة (المتغير المستقل).
   المتغير التابع: مسافة التوقف. القيم حقيقية: d = h ÷ μ
   ========================================================= */
const SURF={
  glass:{name:'زجاج أملس',mu:0.12},
  wood:{name:'خشب',mu:0.30},
  sand:{name:'ورق صنفرة خشن',mu:0.60}
};
const FR={g:9.8,m:0.5,L:2.6,R:0.45,HMAX:0.35,heights:[0.10,0.20,0.30],tol:0.03,flag:1.0};
const frDist=(s,h)=>Math.min(FR.L,h/SURF[s].mu);
const frV0=h=>Math.sqrt(2*FR.g*h);
const frF=s=>SURF[s].mu*FR.m*FR.g;
const cm=h=>Math.round(h*100);
const fx2=v=>(Math.round(v*100)/100).toFixed(2);

const FRSIM=(()=>{
  const W=800,LH=118,TOP=12,XB=680,S=215,BW=.10*S,BH=.06*S;
  let cv,c,raf=0,last=0,col={},L=[],opt={},onEvent=null;
  const hR=u=>FR.HMAX*Math.pow(u/FR.R,2);
  const dR=u=>2*FR.HMAX*u/(FR.R*FR.R);
  const uOf=h=>FR.R*Math.sqrt(h/FR.HMAX);
  const yb=i=>TOP+i*LH+LH-40;
  const prand=i=>{const x=Math.sin(i*91.7+17.3)*43758.5453;return x-Math.floor(x)};
  function readColors(){const cs=getComputedStyle(document.documentElement);
    col={ink:cs.getPropertyValue('--ink').trim()||'#13324A',ink2:cs.getPropertyValue('--ink-2').trim()||'#4F6879',
         paper:cs.getPropertyValue('--paper').trim()||'#fff',bad:cs.getPropertyValue('--bad').trim()||'#C3473E',
         glass:cs.getPropertyValue('--glass').trim()||'#4FB3C8'}}
  function mount(canvas,lanes,o,ev){
    cancelAnimationFrame(raf);cv=canvas;c=cv.getContext('2d');opt=o||{};onEvent=ev;
    L=lanes.map(s=>({s,h:null,phase:'idle',u:0,d:0,v:0,t:0,v0:0}));
    const H=TOP+lanes.length*LH+4,dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.aspectRatio=`${W}/${H}`;c.setTransform(dpr,0,0,dpr,0,0);
    readColors();last=performance.now();raf=requestAnimationFrame(loop);
  }
  function stop(){cancelAnimationFrame(raf)}
  function place(i,h){const l=L[i];if(!l||l.phase==='ramp'||l.phase==='flat')return false;
    Object.assign(l,{h,phase:'ready',u:uOf(h),d:0,v:0,t:0,v0:0});return true}
  function release(i){const l=L[i];if(!l||l.phase!=='ready')return false;l.phase='ramp';l.v=0;l.t=0;return true}
  function hitTest(px,py){ // إحداثيات اللوحة → مسار وعلامة ارتفاع
    for(let i=0;i<L.length;i++){
      let best=null,bd=1e9;
      for(const h of FR.heights){const u=uOf(h),x=XB+u*S,y=yb(i)-h*S;const dd=Math.hypot(px-x,py-y);if(dd<bd){bd=dd;best=h}}
      if(bd<34)return {lane:i,h:best};
    }
    return null;
  }
  function toCanvas(cx_,cy_){const r=cv.getBoundingClientRect();return {x:(cx_-r.left)*W/r.width,y:(cy_-r.top)*(cv.height/(Math.min(2,window.devicePixelRatio||1)))/r.height}}
  function step(dt){
    for(let i=0;i<L.length;i++){const l=L[i];
      if(l.phase==='ramp'){
        for(let k=0;k<8;k++){const ddt=dt/8;const sl=dR(l.u),sin=sl/Math.sqrt(1+sl*sl);
          l.v+=FR.g*sin*ddt;const du=l.v*ddt/Math.sqrt(1+sl*sl);l.u-=du;l.t+=ddt;
          if(l.u<=0){l.u=0;l.v0=frV0(l.h);l.v=l.v0;l.phase='flat';l.tf=0;break}}
      }else if(l.phase==='flat'){
        onEvent&&onEvent('pos',i,XB-l.d*S);
        const a=SURF[l.s].mu*FR.g;
        l.v-=a*dt;l.tf+=dt;l.t+=dt;
        if(l.v<=0){l.v=0;l.d=frDist(l.s,l.h);l.tf=l.v0/a;l.phase='stop';onEvent&&onEvent('stop',i,{d:l.d,tf:l.tf,v0:l.v0})}
        else{l.d=Math.min(FR.L,(l.v0*l.v0-l.v*l.v)/(2*a))}
      }
    }
  }
  function blockAt(l,i){
    if(l.phase==='ready'||l.phase==='ramp'){const u=l.u,sl=dR(u);return {x:XB+u*S,y:yb(i)-hR(u)*S,ang:Math.atan(sl)}}
    return {x:XB-l.d*S,y:yb(i),ang:0};
  }
  function surfStrip(s,x0,x1,y){
    c.save();c.beginPath();c.rect(x1,y,x0-x1,9);c.clip();
    if(s==='glass'){const g=c.createLinearGradient(0,y,0,y+9);g.addColorStop(0,'#E4F5FB');g.addColorStop(1,'#9FD2E6');c.fillStyle=g;c.fillRect(x1,y,x0-x1,9);
      c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=1.2;for(let x=x1+10;x<x0;x+=46){c.beginPath();c.moveTo(x,y+7);c.lineTo(x+14,y+2);c.stroke()}}
    else if(s==='wood'){c.fillStyle='#C8935A';c.fillRect(x1,y,x0-x1,9);c.strokeStyle='rgba(110,66,26,.55)';c.lineWidth=1;
      for(let k=0;k<3;k++){c.beginPath();for(let x=x1;x<=x0;x+=8)c.lineTo(x,y+2+k*2.6+Math.sin(x*.05+k)*0.9);c.stroke()}}
    else{c.fillStyle='#8C7A5B';c.fillRect(x1,y,x0-x1,9);for(let k=0;k<700;k++){const px=x1+prand(k)*(x0-x1),py=y+prand(k+999)*9;
      c.fillStyle=k%3?'rgba(40,30,15,.55)':'rgba(235,220,190,.6)';c.fillRect(px,py,1.6,1.6)}}
    c.restore();c.strokeStyle=col.ink;c.lineWidth=1.2;c.strokeRect(x1,y,x0-x1,9);
  }
  function arrow(x0,y0,x1,y1,color,label,labelBelow){
    c.strokeStyle=color;c.fillStyle=color;c.lineWidth=3;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();
    const a=Math.atan2(y1-y0,x1-x0);c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-9*Math.cos(a-.45),y1-9*Math.sin(a-.45));c.lineTo(x1-9*Math.cos(a+.45),y1-9*Math.sin(a+.45));c.closePath();c.fill();
    if(label){c.font='700 11px "IBM Plex Sans Arabic",sans-serif';c.direction='ltr';c.textAlign='center';c.fillText(label,(x0+x1)/2,(labelBelow?y0+14:y0-6))}
  }
  function draw(){
    const H=TOP+L.length*LH+4;c.clearRect(0,0,W,H);
    L.forEach((l,i)=>{
      const y=yb(i),xEnd=XB-FR.L*S;
      // المنحدر المنحني (أملس ومتماثل)
      c.beginPath();c.moveTo(XB,y+9);for(let u=0;u<=FR.R+1e-9;u+=.01)c.lineTo(XB+u*S,y-hR(u)*S);c.lineTo(XB+FR.R*S,y+9);c.closePath();
      c.fillStyle='rgba(79,179,200,.14)';c.fill();
      c.beginPath();for(let u=0;u<=FR.R+1e-9;u+=.01)c.lineTo(XB+u*S,y-hR(u)*S);c.strokeStyle=col.ink;c.lineWidth=2.4;c.stroke();
      // علامات الارتفاع
      c.font='600 10px "IBM Plex Sans Arabic",sans-serif';c.direction='rtl';c.textAlign='right';
      FR.heights.forEach(h=>{const u=uOf(h),x=XB+u*S,yy=y-h*S,on=l.h===h&&l.phase!=='idle';
        c.fillStyle=on?col.bad:col.ink2;c.beginPath();c.arc(x,yy,on?4.5:3.2,0,7);c.fill();
        c.fillText(`${cm(h)} سم`,x-8,yy+3)});
      // السطح الأفقي + المسطرة
      surfStrip(l.s,XB,xEnd,y);
      c.strokeStyle=col.ink2;c.fillStyle=col.ink2;c.lineWidth=1;c.direction='ltr';c.textAlign='center';c.font='600 10px "IBM Plex Sans Arabic",sans-serif';
      for(let k=0;k<=FR.L*10+1e-6;k++){const x=XB-k/10*S,big=k%5===0;c.beginPath();c.moveTo(x,y+11);c.lineTo(x,y+(big?20:15));c.stroke();if(big)c.fillText(`${(k/10).toFixed(1)} m`,x,y+31)}
      // اسم السطح
      c.direction='rtl';c.textAlign='right';c.fillStyle=col.ink;c.font='700 13px "IBM Plex Sans Arabic",sans-serif';
      c.fillText(SURF[l.s].name,XB-6,y-64);
      // العلم (التحدي)
      if(opt.flag){const fx=XB-opt.flag*S;c.strokeStyle=col.bad;c.lineWidth=2;c.beginPath();c.moveTo(fx,y);c.lineTo(fx,y-44);c.stroke();
        c.fillStyle=col.bad;c.beginPath();c.moveTo(fx,y-44);c.lineTo(fx-20,y-37);c.lineTo(fx,y-30);c.fill()}
      // القالب
      if(l.phase!=='idle'){
        const b=blockAt(l,i);
        c.save();c.translate(b.x,b.y);c.rotate(-b.ang);
        c.fillStyle='#B07A43';c.fillRect(-BW/2,-BH,BW,BH);c.strokeStyle='#5E3A17';c.lineWidth=1.2;c.strokeRect(-BW/2,-BH,BW,BH);
        c.strokeStyle='rgba(94,58,23,.5)';c.beginPath();c.moveTo(-BW/2+3,-BH+4);c.lineTo(BW/2-3,-BH+4);c.stroke();
        c.restore();
        if(l.phase==='flat'||l.phase==='stop'){c.fillStyle=col.bad;c.beginPath();c.moveTo(b.x,y+10);c.lineTo(b.x-4,y+3);c.lineTo(b.x+4,y+3);c.fill()}
        // القوى
        if(opt.forces&&l.phase==='flat'&&l.v>0.02){
          const F=frF(l.s);arrow(b.x,b.y-BH/2,b.x+F*16+8,b.y-BH/2,col.bad,`ق = ${F.toFixed(2)} N`);
          arrow(b.x-BW/2,b.y-BH-10,b.x-BW/2-l.v*30-6,b.y-BH-10,col.glass,'ع');
        }
        // القراءات: تتبع القالب حتى تبقى ظاهرة على الجوال
        const vv=l.phase==='ramp'||l.phase==='flat'?l.v:0;
        if(l.phase!=='ready'){
          const rx=Math.max(xEnd+100,Math.min(XB-100,b.x));
          c.fillStyle=col.ink;c.font='600 12px "IBM Plex Sans Arabic",sans-serif';c.textAlign='center';
          c.fillText(`ع = ${vv.toFixed(2)} m/s   ز = ${(l.phase==='stop'?l.tf:(l.tf||0)).toFixed(2)} s${opt.forces&&l.phase==='stop'?'   · متوقف: لا قوة محصلة':''}`,rx,l.phase==='stop'?y-54:y-44);
        }
        // المسطرة المكبّرة بعد التوقف
        if(l.phase==='stop'){
          const bx=Math.max(xEnd+70,Math.min(XB-70,b.x)),top=y-50,w=140,hh=28,sc=w/0.24;
          c.fillStyle=col.paper;c.strokeStyle=col.ink;c.lineWidth=1.2;c.fillRect(bx-w/2,top,w,hh);c.strokeRect(bx-w/2,top,w,hh);
          c.save();c.beginPath();c.rect(bx-w/2,top,w,hh);c.clip();
          const d=l.d,from=Math.ceil((d-0.12)*100),to=Math.floor((d+0.12)*100);
          c.strokeStyle=col.ink2;c.fillStyle=col.ink2;c.font='600 9px "IBM Plex Sans Arabic",sans-serif';c.textAlign='center';
          for(let k=from;k<=to;k++){const x=bx-(k/100-d)*sc,big=k%5===0;c.beginPath();c.moveTo(x,top);c.lineTo(x,top+(big?10:5));c.stroke();if(big)c.fillText((k/100).toFixed(2),x,top+21)}
          c.restore();c.strokeStyle=col.bad;c.lineWidth=2;c.beginPath();c.moveTo(bx,top-2);c.lineTo(bx,top+hh+2);c.stroke();
          c.strokeStyle=col.ink2;c.setLineDash([2,3]);c.lineWidth=1;c.beginPath();c.moveTo(bx,top+hh);c.lineTo(b.x,y-BH-2);c.stroke();c.setLineDash([]);
        }
      }
    });
  }
  function loop(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;step(dt);draw();raf=requestAnimationFrame(loop)}
  return {mount,stop,place,release,hitTest,toCanvas,lanes:()=>L,setOpt:o=>Object.assign(opt,o),readColors};
})();

    }

  }

function frPlace(i,h){
  const r=APP.run;if(r.step!=='run')return note(r.step==='predict'?'اختر توقعك أولًا.':'أكمل الخطوة الحالية.');

  $('#fh'+i).textContent=`${cm(h)} سم`;$('#fgo'+i).disabled=false;$('#fm'+i).value='';$('#fm'+i).disabled=true;$('#frec'+i).disabled=true;$('#fok'+i).textContent='';$('#ft'+i).textContent='—';

}
function frRelease(i){
  const r=APP.run,L=r.fr.lanes[i];if(r.step!=='run'||!L.h)return;
  const others=r.fr.lanes.filter((x,j)=>j!==i&&x.ran&&x.h!==null);

    note(`انتبه: أطلقت هذا المسار من ${cm(L.h)} سم والمسارات الأخرى من ارتفاع مختلف. هل تبقى المقارنة عادلة؟`,true)}
  FRSIM.release(i);L.ran=true;r.fr.runs.push({s:L.s,h:L.h});$('#fgo'+i).disabled=true;
}
function frStopped(i,res){

function frRecord(i){

/* =========================================================
   🚗 تجربة القصور الذاتي
   الجزء الأول: عربة وراكب تصطدم بحاجز (حزام الأمان).
   الجزء الثاني: الدفعة نفسها لعربات مختلفة الكتلة على مسار شبه عديم الاحتكاك،
   وبوابتان ضوئيتان تقيسان زمن قطع متر واحد. v = F × 0.25 s ÷ m
   ========================================================= */
const IN={PT:0.25,G1:0.6,G2:1.6,END:2.3,BAR:1.2,CART:0.5,W:0.5,forces:[2,4,6,8],mu:0.35,beltF:4,beltM:1.0};
const inV=(F,m)=>F*IN.PT/m;
const inT=(F,m)=>(IN.G2-IN.G1)/inV(F,m);
const kg=m=>(Math.round(m*10)/10).toFixed(1);

const INSIM=(()=>{
  const W=800,XS=720,S=280,CW=.19*S,CH=17,WR=6;
  let cv,c,raf=0,last=0,col={},L=[],mode='gates',onEvent=null,opt={};
  const prand=i=>{const x=Math.sin(i*91.7+17.3)*43758.5453;return x-Math.floor(x)};
  function readColors(){const cs=getComputedStyle(document.documentElement);
    col={ink:cs.getPropertyValue('--ink').trim()||'#13324A',ink2:cs.getPropertyValue('--ink-2').trim()||'#4F6879',
      paper:cs.getPropertyValue('--paper').trim()||'#fff',bad:cs.getPropertyValue('--bad').trim()||'#C3473E',
      glass:cs.getPropertyValue('--glass').trim()||'#4FB3C8',ok:cs.getPropertyValue('--ok').trim()||'#1E8A5C',amber:cs.getPropertyValue('--amber').trim()||'#D98E1F'}}
  const LH=()=>mode==='belt'?128:126;
  const yb=i=>8+i*LH()+LH()-30;
  function mount(canvas,m,lanes,o,ev){
    cancelAnimationFrame(raf);cv=canvas;c=cv.getContext('2d');mode=m;opt=o||{};onEvent=ev;
    L=lanes.map(x=>Object.assign({phase:'ready',x:0,v:0,t:0,F:null,g1:null,g2:null,timer:0,px:0,py:0,pv:0,pvy:0,pstate:'on'},x));
    const H=8+lanes.length*LH()+4,dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.aspectRatio=`${W}/${H}`;c.setTransform(dpr,0,0,dpr,0,0);
    readColors();last=performance.now();raf=requestAnimationFrame(loop);
  }
  function stop(){cancelAnimationFrame(raf)}
  function release(i,F){const l=L[i];if(!l||!(l.phase==='ready'||l.phase==='done'))return false;
    Object.assign(l,{phase:'push',x:0,v:0,t:0,F,g1:null,g2:null,timer:0,px:0,py:0,pv:0,pvy:0,pstate:'on',pd:0});return true}
  function reset(i){const l=L[i];if(l)Object.assign(l,{phase:'ready',x:0,v:0,t:0,g1:null,g2:null,timer:0,px:0,py:0,pstate:'on'})}
  function laneAt(px,py){const H=LH();const i=Math.floor((py-8)/H);return i>=0&&i<L.length?i:-1}
  function toCanvas(cx_,cy_){const r=cv.getBoundingClientRect();const H=cv.height/Math.min(2,window.devicePixelRatio||1);return {x:(cx_-r.left)*W/r.width,y:(cy_-r.top)*H/r.height}}
  function stepLane(l,i,dt){
    const m=l.m;
    if(l.phase==='push'){const a=l.F/m;l.t+=dt;const tp=Math.min(l.t,IN.PT);l.v=a*tp;l.x=.5*a*tp*tp;if(l.t>=IN.PT){l.phase='coast';l.v=inV(l.F,m)}}
    else if(l.phase==='coast'){l.t+=dt;l.x+=l.v*dt;}
    else return;
    if(mode==='gates'){
      if(l.g1===null&&l.x>=IN.G1){l.g1=l.t-(l.x-IN.G1)/l.v}
      if(l.g1!==null&&l.g2===null){l.timer=l.t-l.g1;if(l.x>=IN.G2){l.g2=l.g1+(IN.G2-IN.G1)/l.v;l.timer=l.g2-l.g1;onEvent&&onEvent('timer',i,{t:l.timer})}}
      if(l.x>=IN.END){l.x=IN.END;l.v=0;l.phase='done';onEvent&&onEvent('done',i,{})}
      onEvent&&onEvent('pos',i,XS-l.x*S);
    }else{
      // الحاجز: تتوقف العربة فجأة عند BAR (مقدمة العربة)
      if(l.x>=IN.BAR-.16){l.x=IN.BAR-.16;const v=l.v;l.v=0;l.phase='hit';l.pv=l.belt?0:v;l.pstate=l.belt?'held':'slide';l.ht=0;onEvent&&onEvent('hit',i,{v})}
      onEvent&&onEvent('pos',i,XS-l.x*S);
    }
  }
  function stepPassenger(l,i,dt){
    if(l.phase!=='hit')return;
    l.ht+=dt;
    if(l.pstate==='held'){if(l.ht>.6){l.phase='done';onEvent&&onEvent('done',i,{belt:true,d:0})}return}
    const top=.16;   // طول سطح العربة
    if(l.pstate==='slide'){l.px+=l.pv*dt;if(l.px>=top-.02){l.pstate='fly';l.pvy=0}}
    else if(l.pstate==='fly'){l.px+=l.pv*dt;l.pvy+=9.8*dt;l.py+=l.pvy*dt;if(l.py>=.075){l.py=.075;l.pstate='ground'}}
    else if(l.pstate==='ground'){l.pv-=IN.mu*9.8*dt;if(l.pv<=0){l.pv=0;l.pstate='rest';l.phase='done';onEvent&&onEvent('done',i,{belt:false,d:l.px})}else l.px+=l.pv*dt}
  }
  function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📊 تقرير الواجبات — المعلم الذكي</title><link rel="stylesheet" href="report.css"></head>
<body>
<header><div><h1>📊 تقرير الواجبات</h1><small>من مدرستي إلى مساعد المعلم · القراءة من جلستك مباشرة</small></div>
  <button id="reload" class="ghost">↻ تحديث القائمة</button></header>
<main>
  <div class="toolbar"><div id="status" class="note">جارٍ جلب واجباتك من مدرستي…</div>
    <button id="save-all" class="tick" hidden>💾 حفظ الكل</button></div>
  <div id="filters" hidden>
    <input id="q" placeholder="ابحث باسم الواجب…">
    <select id="cls"><option value="">كل الفصول</option></select>
    <select id="range">
      <option value="current">الأسبوع الدراسي الحالي</option><option value="previous">الأسبوع الدراسي السابق</option>
      <option value="last2">آخر أسبوعين</option><option value="last4">آخر 4 أسابيع</option>
      <option value="last8">آخر 8 أسابيع</option><option value="last12">آخر 12 أسبوعًا</option>
      <option value="last30">آخر 30 يومًا</option><option value="all">كل الواجبات</option>
    </select>
    <label><input type="checkbox" id="skip-existing" checked> تخطي المحفوظ سابقًا</label>
  </div>
  <div id="list"></div>
  <div id="tokbox" class="overlay" hidden><div class="dialog" role="dialog" aria-modal="true">
    <b>🔑 كلمة سر المعلم الذكي</b><p>مرة واحدة فقط — تُحفظ في الإضافة، وتُكمل عمليات الحفظ المعلّقة تلقائيًا.</p>
    <input id="tok" type="password" autocomplete="off"><div class="dlg-err" id="tok-err"></div>
    <div class="dlg-acts"><button id="tok-save" class="tick">متابعة الحفظ</button><button id="tok-cancel" class="soft">إلغاء</button></div></div></div>
</main>
<script src="report.js"></script>
</body></html>
